<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{ color-scheme: dark; --bg:#15181D; --ink:#EDE6D6; --paper:#F4EEDF; --dark:#1E222A; --red:#E0493E; --blue:#3E8EDE; --gold:#E8B23A; }
  html,body{height:100%;overscroll-behavior:none;}
  /* iPhone でスティックの指がずれても画面ごと上下しないように、ページを固定する */
  body{position:fixed;inset:0;width:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"M PLUS Rounded 1c",system-ui,sans-serif;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
  #app{position:relative;height:100%;display:flex;align-items:center;justify-content:center;}
  canvas{display:block;touch-action:none;}
  #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,12,15,.6);padding:16px;}
  #overlay[hidden]{display:none;}
  #quit{position:absolute;margin:0;padding:6px 14px;font-size:12px;border-radius:9px;background:#3A3F49;box-shadow:0 3px 0 #000;z-index:2;}
  #quit[hidden]{display:none;}
  .note{font-size:12px !important;color:#5A5E66;margin:0 0 6px !important;}
  .side{border:2px solid #D8CDB5;border-radius:12px;padding:6px 8px 10px;margin-top:10px;}
  .foeSide{border-color:#E0A89F;background:#FBEDE8;}
  .sideT{font-family:"Dela Gothic One",sans-serif;font-size:15px;text-align:left;}
  .lv{display:flex;align-items:center;justify-content:center;gap:14px;}
  .lv button{margin:0;padding:4px 16px;font-size:18px;}
  .lv b{font-size:18px;color:#23252B !important;min-width:52px;}
  .card{background:var(--paper);color:#23252B;border-radius:16px;padding:22px 20px;max-width:340px;width:100%;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.45);}
  .card h1{font-family:"Dela Gothic One",sans-serif;font-size:40px;margin:0 0 4px;letter-spacing:.06em;}
  .card h2{font-family:"Dela Gothic One",sans-serif;font-size:26px;margin:0 0 6px;}
  .card p{margin:8px 0;line-height:1.6;font-size:14px;}
  .card ul{text-align:left;padding-left:1.2em;margin:10px 0;font-size:13px;line-height:1.7;}
  .card b{color:#B8322A;}
  button{font:inherit;cursor:pointer;border:0;border-radius:12px;background:#23252B;color:var(--paper);font-weight:800;font-size:17px;padding:12px 28px;margin-top:10px;box-shadow:0 4px 0 #000;}
  button:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
  button.sub{background:transparent;color:#23252B;box-shadow:none;border:2px solid #23252B;font-size:14px;padding:8px 20px;}
  .card.load{max-height:100%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:16px 14px;box-sizing:border-box;}
  .card h3{font-size:13px;margin:12px 0 5px;text-align:left;color:#5A5E66;}
  .foe{background:#2B2F37;color:#F4EEDF;border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.6;}
  .foe b{color:#FF9B8F;}
  .grow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
  .grow.g4{grid-template-columns:repeat(2,1fr);}
  .gbtn{margin:0;padding:7px 5px;display:flex;flex-direction:column;gap:2px;align-items:center;background:#E4DCC9;color:#23252B;box-shadow:0 3px 0 #B9AE95;border-radius:10px;}
  .gbtn span{font-family:"Dela Gothic One",sans-serif;font-size:16px;font-weight:400;}
  .gbtn small{font-size:10px;line-height:1.35;font-weight:800;}
  .gbtn .pro{color:#2F7A45;} .gbtn .con{color:#B8322A;}
  .gbtn.on{background:#23252B;color:#F4EEDF;box-shadow:0 3px 0 #000;}
  .gbtn.on .pro{color:#8FE0A6;} .gbtn.on .con{color:#FF9B8F;}
  .stats{width:100%;border-collapse:collapse;font-size:12px;color:#23252B;}
  .catprev{display:flex;justify-content:center;gap:10px;margin-top:12px;}
  .catprev figure{margin:0;background:#C9B48A;border-radius:12px;padding:4px 4px 2px;text-align:center;}
  .catprev canvas{width:96px;height:109px;display:block;}
  .catprev figcaption{font-size:11px;font-weight:800;color:#3A2A1A;}
  .stats th{font-size:11px;color:#5A5E66;padding:2px 4px;} .stats td{padding:3px 4px;border-top:1px solid #DDD3BE;}
  .stats td:first-child{text-align:left;} .stats td:not(:first-child){text-align:right;font-weight:800;width:52px;}
  .stats .good{color:#2F7A45;} .stats .bad{color:#B8322A;}
</style>

<div id="app">
  <canvas id="cv"></canvas>
  <button id="quit" hidden>練習をやめる</button>
  <div id="overlay"></div>
</div>

<script>
// ================= 基本設定 =================
const W = 360, H = 640, AR = {x:180, y:262, r:150};
// 武器。最後の段は重く、ためが長く、怯まない（heavy）
//   parry：ガードを押してからこの秒数以内に攻撃を受けると「はじき」
//   guardMul：ガードで受けたときのスタミナの減り方　near：AIがこれより近いと下がる距離
//   inner：槍の突きは、これより近いと柄が当たるだけ（弱い・怯まない）
const WEAPONS = {
  katana: { name:'刀', title:'剣士', desc:'バランス型。はじきの受付が長い',
    speed:125, parry:.20, guardMul:1, dashSt:20, dashIf:.15, near:60, len:34, thick:3.5, blade:'#DDE3EA',
    atk:[
      {wind:.17, act:.08, rec:.24, dmg:8,  st:15, reach:56, arc:1.5, lunge:30, side: 1},
      {wind:.17, act:.08, rec:.26, dmg:10, st:15, reach:58, arc:1.5, lunge:30, side:-1},
      {wind:.45, act:.10, rec:.50, dmg:24, st:28, reach:66, arc:1.9, lunge:80, side: 0, heavy:true},
    ]},
  great: { name:'大剣', title:'大剣使い', desc:'重い2段。ガードが固いが、動きが遅い',
    speed:104, parry:.13, guardMul:.75, dashSt:24, dashIf:.15, near:58, len:46, thick:7, blade:'#C3CAD3',
    atk:[
      {wind:.26, act:.12, rec:.46, dmg:15, st:22, reach:66, arc:2.3, lunge:30, side: 1},
      {wind:.55, act:.14, rec:.62, dmg:30, st:34, reach:72, arc:2.5, lunge:70, side: 0, heavy:true},
    ]},
  dagger: { name:'短剣', title:'短剣使い', desc:'出が速いがリーチが短い。回避が軽い',
    speed:148, parry:.16, guardMul:1.4, dashSt:13, dashIf:.19, near:30, len:20, thick:3, blade:'#E6EBF0',
    atk:[
      {wind:.10, act:.06, rec:.17, dmg:6,  st:10, reach:40, arc:1.4, lunge:26, side: 1},
      {wind:.10, act:.06, rec:.19, dmg:7,  st:10, reach:40, arc:1.4, lunge:26, side:-1},
      {wind:.30, act:.08, rec:.38, dmg:17, st:20, reach:46, arc:1.3, lunge:72, side: 0, heavy:true},
    ]},
  spear: { name:'槍', title:'槍使い', desc:'リーチが長いが突きは細い。懐に弱い',
    speed:115, parry:.16, guardMul:1, dashSt:20, dashIf:.15, near:74, len:64, thick:3, blade:'#DDE3EA', shaft:'#8B6A45',
    atk:[
      {wind:.22, act:.09, rec:.32, dmg:10, st:16, reach:76, arc:.55, lunge:24, side: 0, inner:40},
      {wind:.24, act:.10, rec:.34, dmg:10, st:17, reach:66, arc:2.0, lunge:16, side:-1},
      {wind:.54, act:.12, rec:.56, dmg:24, st:28, reach:84, arc:.65, lunge:60, side: 0, inner:40, heavy:true},
    ]},
};
// すべての攻撃の「ため」に一律で足す秒数。見てからはじけるように（人の反応は0.25秒前後）
const WIND_ADD = .2;
for (const k in WEAPONS) for (const A of WEAPONS[k].atk) A.wind += WIND_ADD;
const WKEYS = Object.keys(WEAPONS);
// アイテム：一定時間ごとに闘技場のどこかへ落ちてくる。着地までは拾えない
const ITEMS = {
  heal: { label:'回復',       icon:'+',  color:'#4FC872' },
  atk:  { label:'攻撃力UP',   icon:'攻', color:'#F0603F' },
  spd:  { label:'速度UP',     icon:'速', color:'#48B4F0' },
  st:   { label:'スタミナ',   icon:'気', color:'#E6C53A' },
};
const IKEYS = Object.keys(ITEMS), BUFF_T = 8, DROP_T = .7, ITEM_LIFE = 12;
const lastIdx = f => f.w.atk.length - 1;
// はじきの受付（秒）＝武器ごとの値＋防具＋全員に足す分＋プレイヤーだけに足す分
const PARRY_ADD = .2;       // 全員のはじき受付に足す秒数
const PARRY_BONUS = .14;     // プレイヤーだけにさらに足す秒数
const ESC_ST_MUL = 1.5;     // はじかれた怯みから回避で抜けるときのスタミナ倍率（待ち一強にしないための逃げ道）
const parryRearm = f => parryWin(f) + .3;   // 押し直してからこの秒数以内は、はじきが出ない（受付が長いほど長く。連打対策）
const parryWin = f => f.w.parry + f.m.parry + PARRY_ADD + (f.isAI ? 0 : PARRY_BONUS);
const parryOpen = f => f.parryOK && G.now - f.guardStart <= parryWin(f);
// 防具：A部・B部・C部に1つずつ。どれも長所と短所がある（将来はガチャ／ショップで入手する予定）
//   mods の意味　hp：体力の上限に足す　stMax：スタミナの上限に足す　parry・dashIf：はじき受付・回避の無敵（秒）に足す
//   dashSt：回避のスタミナに足す　それ以外は倍率（dmgTaken：受けるダメージ、speed：移動、stRegen：スタミナ回復、
//   guardMul：ガードで減るスタミナ、dashDist：回避の距離、knock：吹き飛び、stunMul：怯みの長さ）
const ARMOR = {
  A: { label:'A部', items:{
    a1: { name:'鉄兜',   pros:['受けるダメ-12%'],          cons:['移動-5%'],           mods:{dmgTaken:.88, speed:.95} },
    a2: { name:'鉢金',   pros:['はじき受付+0.05秒'],       cons:['体力-10'],           mods:{parry:.05, hp:-10} },
    a3: { name:'羽根冠', pros:['回避の無敵+0.05秒'],       cons:['受けるダメ+8%'],     mods:{dashIf:.05, dmgTaken:1.08} },
  }},
  B: { label:'B部', items:{
    b1: { name:'大鎧',   pros:['体力+30'],                 cons:['移動-12%','スタミナ回復-10%'], mods:{hp:30, speed:.88, stRegen:.9} },
    b2: { name:'鎖帷子', pros:['ガード時のスタミナ減-25%','体力+10'], cons:['回避スタミナ+4'], mods:{guardMul:.75, hp:10, dashSt:4} },
    b3: { name:'道着',   pros:['スタミナ上限+25','スタミナ回復+15%'], cons:['体力-10'], mods:{stMax:25, stRegen:1.15, hp:-10} },
  }},
  C: { label:'C部', items:{
    c1: { name:'鉄靴',   pros:['吹き飛び半減','怯み-25%'], cons:['移動-7%'],           mods:{knock:.5, stunMul:.75, speed:.93} },
    c2: { name:'草鞋',   pros:['移動+12%'],                cons:['受けるダメ+5%'],     mods:{speed:1.12, dmgTaken:1.05} },
    c3: { name:'足袋',   pros:['回避スタミナ-6','回避距離+25%'], cons:['ガード時のスタミナ減+15%'], mods:{dashSt:-6, dashDist:1.25, guardMul:1.15} },
  }},
};
const SLOTS = Object.keys(ARMOR), ADDITIVE = ['hp', 'stMax', 'parry', 'dashIf', 'dashSt'];
const randomGear = () => Object.fromEntries(SLOTS.map(s => { const ks = Object.keys(ARMOR[s].items); return [s, ks[Math.floor(Math.random()*ks.length)]]; }));
function calcMods(gear){
  const m = {hp:0, stMax:0, parry:0, dashIf:0, dashSt:0, dmgTaken:1, speed:1, stRegen:1, guardMul:1, dashDist:1, knock:1, stunMul:1};
  for (const s of SLOTS) { const it = ARMOR[s].items[gear[s]]; if (!it) continue;
    for (const k in it.mods) { if (ADDITIVE.includes(k)) m[k] += it.mods[k]; else m[k] *= it.mods[k]; } }
  return m;
}
const gearNames = g => SLOTS.map(s => ARMOR[s].items[g[s]].name).join('・');
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), ov = document.getElementById('overlay');
const quitBtn = document.getElementById('quit');
quitBtn.onclick = () => quitPractice();
let scale = 1, G = null, bestLv = 1, myW = 'katana', myGear = {A:'a1', B:'b2', C:'c2'};
try { bestLv = +localStorage.getItem('maai_best') || 1; myW = WEAPONS[localStorage.getItem('maai_weapon')] ? localStorage.getItem('maai_weapon') : 'katana';
  const g = JSON.parse(localStorage.getItem('maai_gear') || 'null'); if (g && SLOTS.every(s => ARMOR[s].items[g[s]])) myGear = g; } catch(e) {}

function resize(){
  const a = document.getElementById('app').getBoundingClientRect(), dpr = devicePixelRatio || 1;
  scale = Math.min(a.width/W, a.height/H);
  cv.style.width = W*scale + 'px'; cv.style.height = H*scale + 'px';
  cv.width = W*scale*dpr; cv.height = H*scale*dpr;
  ctx.setTransform(dpr*scale,0,0,dpr*scale,0,0);
  // 「練習をやめる」は操作パネルの左上（空いている場所）に置く
  const c = cv.getBoundingClientRect(); quitBtn.style.left = (c.left - a.left + 10*scale) + "px"; quitBtn.style.top = (c.top - a.top + 440*scale) + "px"; quitBtn.style.fontSize = 11*scale + "px"; quitBtn.style.padding = `${5*scale}px ${11*scale}px`;
}
addEventListener('resize', resize);
const rnd = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const angDiff = (a,b) => { let d = a-b; while (d > Math.PI) d -= Math.PI*2; while (d < -Math.PI) d += Math.PI*2; return d; };

// ================= 試合 =================
function mkF(x, y, isAI, color, name, wk, gear){
  const m = calcMods(gear), maxHp = 100 + m.hp, stMax = 100 + m.stMax;
  return {x, y, r:15, face: isAI ? Math.PI/2 : -Math.PI/2, hp:maxHp, maxHp, st:stMax, stMax, stLast:-9, stFlash:0, state:'idle', t:0, atk:0,
          queued:false, isAI, color, name, guard:false, guardStart:-9, iframe:0, stunT:0, kx:0, ky:0, dashDir:0, flash:0,
          windId:0, trail:[], moveSpd:0, walkPh:0, combo:0, w:WEAPONS[wk], gear, m, dashSt:Math.max(6, WEAPONS[wk].dashSt + m.dashSt), buffs:{atk:0, spd:0, st:0}};
}
function newMatch(level, eW, eGear, practice){
  eW = eW || WKEYS[Math.floor(Math.random()*WKEYS.length)]; eGear = eGear || randomGear();
  G = { level, eW, eGear, practice:!!practice, count:{parry:0, taken:0, given:0}, round:1, pw:0, ew:0, now:0, hitstop:0, slowT:0, shake:0, fx:[], texts:[], phase:'intro', phaseT:0 };
  newRound(); ov.hidden = true; quitBtn.hidden = !G.practice;
}
function newRound(){
  G.p = mkF(AR.x, AR.y + 80, false, '#3E8EDE', `あなた（${WEAPONS[myW].name}）`, myW, myGear);
  G.e = mkF(AR.x, AR.y - 80, true, '#E0493E', `${WEAPONS[G.eW].title} Lv${G.level}`, G.eW, G.eGear);
  G.ai = {heat:0, seenWind:-1, guardAt:0, releaseAt:0, dashAt:0, attackAt:0, comboLeft:0, strafe:1, strafeT:0, backoff:0};
  G.phase = 'intro'; G.phaseT = 0; G.fx = []; G.texts = [];
  G.items = []; G.itemT = rnd(6, 9);
}
function spawnItem(){
  let x, y;
  for (let i=0; i<12; i++) {   // 誰かの真上には落とさない
    const a = rnd(0, Math.PI*2), r = Math.sqrt(Math.random())*(AR.r - 30);
    x = AR.x + Math.cos(a)*r; y = AR.y + Math.sin(a)*r;
    if (Math.hypot(x - G.p.x, y - G.p.y) > 55 && Math.hypot(x - G.e.x, y - G.e.y) > 55) break;
  }
  G.items.push({x, y, type: IKEYS[Math.floor(Math.random()*IKEYS.length)], t:0});
}
function updateItems(dt){
  if (!G.items.length) { G.itemT -= dt; if (G.itemT <= 0) { spawnItem(); G.itemT = rnd(7, 12); } }
  for (const it of G.items) {
    it.t += dt; if (it.t < DROP_T) continue;
    for (const f of [G.p, G.e]) {
      if (it.gone || f.state === 'stun' || Math.hypot(f.x - it.x, f.y - it.y) > f.r + 12) continue;
      const I = ITEMS[it.type]; it.gone = true;
      if (it.type === 'heal') f.hp = Math.min(f.maxHp, f.hp + 30);
      else if (it.type === 'st') { f.st = f.stMax; f.buffs.st = BUFF_T; }
      else f.buffs[it.type] = BUFF_T;
      say(I.label, f.x, f.y - 40, I.color, 18, 1.1); spark(it.x, it.y, I.color, 14, 200);
    }
  }
  G.items = G.items.filter(it => !it.gone && it.t < ITEM_LIFE);
}
function say(s, x, y, c, size=18, life=.9){ G.texts.push({s, x, y, c, size, life, max:life}); }
function spark(x, y, c, n=10, sp=220){ for (let i=0;i<n;i++){ const a = rnd(0, Math.PI*2), v = rnd(sp*.3, sp); G.fx.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:rnd(.2,.45), c}); } }

function startAttack(f, n){
  const A = f.w.atk[n];
  if (f.st < A.st) { f.stFlash = .35; return false; }
  f.st -= A.st; f.stLast = G.now; f.state = 'windup'; f.atk = n; f.t = 0; f.queued = false; f.guard = false; f.windId++;
  return true;
}
function startDash(f, o, mx, my, cost = f.dashSt){
  if (f.st < cost) { f.stFlash = .35; return false; }
  let dx = mx, dy = my;
  if (Math.hypot(dx, dy) < .3) { dx = f.x - o.x; dy = f.y - o.y; }          // スティックなし → 後ろへ
  const l = Math.hypot(dx, dy) || 1;
  f.dashDir = Math.atan2(dy/l, dx/l); f.st -= cost; f.stLast = G.now;
  f.state = 'dash'; f.t = 0; f.iframe = f.w.dashIf + f.m.dashIf; f.guard = false; f.stunKind = '';
  return true;
}

// 入力を受け取って行動に変える（プレイヤーもAIも同じ関数を通す）
function control(f, o, inp, dt){
  if (f.state === 'idle') {
    if (inp.guard && !f.guard) { f.guard = true; f.parryOK = G.now - f.guardStart > parryRearm(f); f.guardStart = G.now; }
    if (!inp.guard) f.guard = false;
    if (inp.attack) { startAttack(f, 0); inp.attack = false; }
    else if (inp.dash) { startDash(f, o, inp.mx, inp.my); }
    if (f.state === 'idle') {
      const sp = (f.guard ? f.w.speed*.44 : f.w.speed)*f.m.speed*(f.buffs.spd > 0 ? 1.35 : 1), l = Math.hypot(inp.mx, inp.my);
      if (l > .15) { const k = Math.min(1, l); f.x += inp.mx/l*k*sp*dt; f.y += inp.my/l*k*sp*dt; }
    }
  } else if ((f.state === 'windup' || f.state === 'active' || f.state === 'recover') && inp.attack && f.atk < lastIdx(f)) {
    f.queued = true;
  } else if (f.state === 'stun' && f.stunKind === 'parry' && inp.dash) {   // はじかれた怯みの間だけ、回避で抜けられる（スタミナ多め）
    if (startDash(f, o, inp.mx, inp.my, Math.round(f.dashSt*ESC_ST_MUL))) { say('緊急回避', f.x, f.y - 36, '#8FE3FF', 15, .7); }
  }
  inp.attack = false; inp.dash = false;
}

function stepF(f, o, dt){
  const toO = Math.atan2(o.y - f.y, o.x - f.x);
  for (const k in f.buffs) f.buffs[k] = Math.max(0, f.buffs[k] - dt);
  f.iframe = Math.max(0, f.iframe - dt); f.flash = Math.max(0, f.flash - dt); f.stFlash = Math.max(0, f.stFlash - dt);
  f.x += f.kx*dt; f.y += f.ky*dt; const dk = Math.exp(-9*dt); f.kx *= dk; f.ky *= dk;
  const busy = f.state === 'windup' || f.state === 'active' || f.state === 'recover' || f.state === 'dash';
  if (!busy && G.now - f.stLast > .5) f.st = Math.min(f.stMax, f.st + (f.guard ? 8 : 28)*f.m.stRegen*(f.buffs.st > 0 ? 2 : 1)*dt);
  // 動いた速さ（歩きの弾みに使う）
  const lt = f.trail[f.trail.length - 1]; if (lt && dt > 0) f.moveSpd = f.moveSpd*.7 + .3*Math.hypot(f.x - lt.x, f.y - lt.y)/dt;
  if (f.state === 'idle' && f.moveSpd > 25) f.walkPh += dt*Math.min(f.moveSpd, 170)*.11;
  f.trail.push({x:f.x, y:f.y}); if (f.trail.length > 6) f.trail.shift();

  if (f.state === 'idle') f.face = toO;
  else if (f.state === 'windup') {
    f.face += clamp(angDiff(toO, f.face), -4.5*dt, 4.5*dt);   // ため中は向きがゆっくりしか変わらない → 横に回り込めばかわせる
    f.t += dt;
    if (f.t >= f.w.atk[f.atk].wind) { f.state = 'active'; f.t = 0; resolveHit(f, o); }
  } else if (f.state === 'active') {
    const A = f.w.atk[f.atk]; f.t += dt;
    f.x += Math.cos(f.face)*A.lunge/A.act*dt; f.y += Math.sin(f.face)*A.lunge/A.act*dt;
    if (f.t >= A.act) { f.state = 'recover'; f.t = 0; }
  } else if (f.state === 'recover') {
    const A = f.w.atk[f.atk]; f.t += dt;
    if (f.queued && f.atk < lastIdx(f) && f.t > A.rec*.25) { if (!startAttack(f, f.atk+1)) f.queued = false; }
    else if (f.t >= A.rec) { f.state = 'idle'; f.t = 0; f.queued = false; }
  } else if (f.state === 'dash') {
    f.t += dt;
    if (f.t < .16) { f.x += Math.cos(f.dashDir)*430*f.m.dashDist*dt; f.y += Math.sin(f.dashDir)*430*f.m.dashDist*dt; }
    if (f.t >= .26) { f.state = 'idle'; f.t = 0; }
  } else if (f.state === 'stun') {
    f.t += dt; if (f.t >= f.stunT) { f.state = 'idle'; f.t = 0; }
  }
  // 闘技場の外に出ない
  const dx = f.x - AR.x, dy = f.y - AR.y, d = Math.hypot(dx, dy), lim = AR.r - f.r;
  if (d > lim) { f.x = AR.x + dx/d*lim; f.y = AR.y + dy/d*lim; }
}

function resolveHit(att, def){
  if (G.phase !== 'fight') return;
  const A = att.w.atk[att.atk], dx = def.x - att.x, dy = def.y - att.y, d = Math.hypot(dx, dy);
  const dmg = Math.round(A.dmg*(att.buffs.atk > 0 ? 1.4 : 1)*def.m.dmgTaken);   // 攻撃力UP中は1.4倍、防具で増減
  const inArc = Math.abs(angDiff(Math.atan2(dy, dx), att.face)) < A.arc/2 + (d < 36 ? .5 : 0);
  if (d > A.reach + A.lunge*.5 + def.r || !inArc) { if (d < 160) say('空振り', att.x, att.y - 30, '#9AA3AE', 13, .6); return; }
  const hx = (att.x+def.x)/2, hy = (att.y+def.y)/2, nx = dx/(d||1), ny = dy/(d||1);
  if (def.iframe > 0) { say('回避！', def.x, def.y - 32, '#8FE3FF', 16); return; }
  if (def.guard && def.state === 'idle') {
    if (parryOpen(def)) {           // はじき：攻撃側に大きな隙
      att.state = 'stun'; att.stunKind = 'parry'; att.stunT = .95; att.t = 0; att.queued = false;
      def.st = Math.min(def.stMax, def.st + 15);
      att.kx -= nx*160; att.ky -= ny*160;
      spark(hx, hy, '#FFFFFF', 22, 320); spark(hx, hy, '#FFE08A', 10, 200);
      say('はじき！', hx, hy - 26, '#FFE08A', 26, 1.1);
      if (def === G.p) G.count.parry++;
      G.hitstop = .12; G.slowT = .45; G.shake = .18;
      return;
    }
    def.st -= dmg*1.8*def.w.guardMul*def.m.guardMul; if (!G.practice) def.hp -= dmg*.1; def.stLast = G.now;   // 普通のガード：スタミナが削れる
    def.kx += nx*140*def.m.knock; def.ky += ny*140*def.m.knock;
    spark(hx, hy, '#9CCBFF', 8, 180); say('ガード', def.x, def.y - 30, '#9CCBFF', 13, .5);
    G.hitstop = .04;
    if (def.st <= 0) {
      def.st = 0; def.guard = false; def.state = 'stun'; def.stunKind = 'break'; def.stunT = 1.1; def.t = 0;
      say('ガードブレイク！', def.x, def.y - 36, '#FF9F43', 20, 1.1); G.shake = .2; G.hitstop = .1;
    }
    return;
  }
  if (A.inner && d < A.inner + def.r - 15) {               // 槍の懐：柄が当たるだけ
    const dm = Math.round(dmg*.3); if (!G.practice) def.hp -= dm; def.kx += nx*90; def.ky += ny*90;
    spark(hx, hy, '#C9A27A', 6, 150); say(`${dm} 懐`, def.x, def.y - 34, '#C9A27A', 15, .7); G.hitstop = .03;
    if (def.hp <= 0) { def.hp = 0; ko(def); }
    return;
  }
  if (!G.practice) def.hp -= dmg;   // 練習では体力が減らない
  def.flash = .12; G.count[def === G.p ? 'taken' : 'given']++;
  def.kx += nx*(A.heavy ? 330 : 170)*def.m.knock; def.ky += ny*(A.heavy ? 330 : 170)*def.m.knock;
  spark(hx, hy, '#FF6B5E', A.heavy ? 20 : 10, A.heavy ? 320 : 220);
  say(String(dmg), def.x + rnd(-8,8), def.y - 34, A.heavy ? '#FF9F43' : '#FFFFFF', A.heavy ? 24 : 18);
  G.hitstop = A.heavy ? .13 : .05; G.shake = A.heavy ? .22 : .08;
  const armor = (def.state === 'windup' || def.state === 'active') && def.w.atk[def.atk].heavy;   // 最後の段は怯まない
  if (!armor) { def.state = 'stun'; def.stunKind = 'hit'; def.stunT = (A.heavy ? .55 : .18)*def.m.stunMul; def.t = 0; def.guard = false; def.queued = false; }
  if (def.hp <= 0) { def.hp = 0; ko(def); }
}

function ko(loser){
  G.phase = 'ko'; G.phaseT = 0; G.slowT = 1.0;
  if (loser === G.e) G.pw++; else G.ew++;
}

// ================= AI =================
function aiThink(dt){
  const e = G.e, p = G.p, ai = G.ai, L = G.level, now = G.now;
  const pf = ai.prof || {};   // 自動テスト用：人間に近い反応の操作に差し替えられる
  // v0.12 で全体に弱くした（反応が遅く、はじき・ガードが減り、攻めも控えめ）
  const react = pf.react ?? Math.max(.18, .40 - .022*(L-1));
  const parryRate = pf.parryRate ?? Math.min(.40, .04 + .04*(L-1));
  const blockRate = pf.blockRate ?? .32;
  const aggression = pf.aggression ?? .5 + .12*L;
  const inp = {mx:0, my:0, guard:false, attack:false, dash:false};
  ai.heat = Math.max(0, ai.heat - dt*.8);
  const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy), ux = dx/(d||1), uy = dy/(d||1);
  const atkD = e.w.atk[0].reach + 16, pD = p.w.atk[0].reach + p.w.atk[0].lunge*.5 + 30;   // 自分の攻撃が届く距離／相手の攻撃が届く距離
  const dashSt = e.dashSt;

  // 相手のため動作を見て、守り方を決める
  if (p.state === 'windup' && p.windId !== ai.seenWind) {
    ai.seenWind = p.windId; ai.heat += 1;
    const A = p.w.atk[p.atk], hitAt = now + (A.wind - p.t), canAt = now + react + rnd(-.03, .07), holding = e.guard;   // 反応の速さには毎回ばらつきがある
    ai.guardAt = 0; ai.dashAt = 0; ai.dashIn = false;
    const escCost = Math.round(dashSt*ESC_ST_MUL);
    if (e.state === 'stun' && e.stunKind === 'parry') {   // はじかれて怯んでいる → 緊急回避で逃げるか、耐えるか
      if (d < A.reach + 70 && e.st >= escCost && Math.random() < (pf.escRate ?? Math.min(.5, .12 + .038*L))) ai.dashAt = Math.max(canAt, hitAt - rnd(.02, .12));
    } else if (d < A.reach + 70) {
      const r = Math.random(), pr = holding ? 0 : parryRate + Math.min(.2, ai.heat*.04);   // 攻めが単調だと読まれる
      if (A.heavy && r < (pf.heavyDodge ?? .45) && e.st >= dashSt)  ai.dashAt = Math.max(canAt, hitAt - rnd(.02, .12));
      else if (r < pr)                           ai.guardAt = Math.max(canAt, hitAt - rnd(.03, parryWin(e) - .03));
      else if (r < pr + blockRate)               ai.guardAt = holding ? now : canAt;   // 構えたままなら、そのまま受ける
      else if (r < pr + blockRate + .12 && e.st >= dashSt) ai.dashAt = canAt;
      else if (e.state === 'idle' && d < atkD && e.st > 20 && !A.heavy) ai.attackAt = canAt;   // 相打ち狙い
      ai.releaseAt = hitAt + .12;
    }
  }
  // 出の速い相手（短剣など）は見てからでは間に合わない → 間合いに入られたら先に構えることがある
  if (!ai.guardAt && e.state === 'idle' && p.state === 'idle' && d < pD && (p.w.atk[0].wind < .15 || pf.preguard) && Math.random() < dt*(.8 + .15*L)) {
    ai.guardAt = now; ai.releaseAt = now + rnd(.3, .7);
  }
  let guarding = ai.guardAt && now >= ai.guardAt && now < ai.releaseAt;
  if (ai.guardAt && now >= ai.releaseAt) ai.guardAt = 0;
  if (ai.dashAt && now >= ai.dashAt) {
    if (ai.dashIn) { inp.mx = ux; inp.my = uy; ai.attackAt = now + .2; ai.comboLeft = Math.min(1, lastIdx(e)); }
    else { inp.mx = -uy*(Math.random()<.5?1:-1) - ux*.6; inp.my = ux*(Math.random()<.5?1:-1) - uy*.6; }
    inp.dash = true; ai.dashAt = 0; ai.dashIn = false;
  }

  // 隙を見つけたら攻める
  const maxC = lastIdx(e);
  const openP = p.state === 'stun' || (p.state === 'recover' && p.t < p.w.atk[p.atk].rec*.6) || (p.state === 'dash' && p.t > .16);
  if (openP && e.state === 'idle' && d < atkD + 23 && !ai.attackAt) { ai.attackAt = now + react*.8; ai.comboLeft = p.state === 'stun' && p.stunT > .8 ? maxC : Math.min(1, maxC); }
  // リーチで負けているときは、相手の空振りを見て回避で懐へ飛び込む
  else if (openP && e.state === 'idle' && d >= atkD + 23 && d < atkD + 90 && pD > atkD + 10 && e.st >= dashSt + 25 && !ai.dashAt && Math.random() < .6)
    ai.dashAt = now + react*.6, ai.dashIn = true;

  if (e.state === 'idle' && !guarding) {
    ai.strafeT -= dt; if (ai.strafeT <= 0) { ai.strafe *= -1; ai.strafeT = rnd(.6, 1.6); }
    if (e.st < 25) { inp.mx = -ux + -uy*ai.strafe*.5; inp.my = -uy + ux*ai.strafe*.5; }
    else if (d > atkD + 16) { inp.mx = ux; inp.my = uy; }
    else { const want = d < e.w.near ? -.6 : .15; inp.mx = ux*want - uy*ai.strafe*.8; inp.my = uy*want + ux*ai.strafe*.8; }
    if (!ai.attackAt && d < atkD && e.st > 30 && Math.random() < dt*aggression) {
      ai.attackAt = now; const r = Math.random(); ai.comboLeft = Math.min(maxC, r < .25 ? 0 : r < .6 ? 1 : 2);
    }
    // アイテム：自分のほうが近ければ拾いに行く。体力が少ないときの回復は多少遠くても狙う
    const it = (G.items || []).find(i => i.t > DROP_T - .3);
    if (it) {
      const de = Math.hypot(it.x - e.x, it.y - e.y), dp = Math.hypot(it.x - p.x, it.y - p.y);
      if ((de < dp - 10 && de < 170) || (it.type === 'heal' && e.hp < 55 && de < dp + 40)) {
        inp.mx = (it.x - e.x)/(de||1); inp.my = (it.y - e.y)/(de||1);
      }
    }
  }
  if (ai.attackAt && now >= ai.attackAt && e.state === 'idle') { inp.attack = true; ai.attackAt = 0; }
  if (ai.attackAt && now - ai.attackAt > .6) ai.attackAt = 0;
  // 連続攻撃の続き（わざと止めてフェイントにすることもある）
  if ((e.state === 'recover' || e.state === 'active') && ai.comboLeft > 0 && e.atk < maxC && !e.queued) { inp.attack = true; ai.comboLeft--; }
  inp.guard = guarding;
  return inp;
}

// ================= 入力 =================
const BTN = { atk:{x:296, y:556, r:38, label:'攻撃'}, grd:{x:214, y:588, r:30, label:'ガード'}, dash:{x:300, y:470, r:28, label:'回避'} };
const P = {mx:0, my:0, guard:false, attack:false, dash:false};
const touches = new Map(); let stick = null; const keys = {};
function toLogical(e){ const r = cv.getBoundingClientRect(); return {x:(e.clientX - r.left)/scale, y:(e.clientY - r.top)/scale}; }
function btnAt(x, y){ for (const k in BTN) { const b = BTN[k]; if (Math.hypot(x-b.x, y-b.y) < b.r + 10) return k; } return null; }
// 画面の外側の余白（iPhoneで上下に残る帯）から触っても操作できるように、#app 全体で受ける
const appEl = document.getElementById('app');
appEl.addEventListener('pointerdown', e => {
  if (e.target !== cv && e.target !== appEl) return;   // 装備画面などのボタンはそのまま
  e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch(err) {}
  const q = toLogical(e), b = btnAt(q.x, q.y);
  if (b) { touches.set(e.pointerId, {role:b}); if (b === 'atk') P.attack = true; if (b === 'dash') P.dash = true; }
  else if (q.x < W*0.6 && q.y > 300) { stick = {id:e.pointerId, ox:q.x, oy:q.y, x:q.x, y:q.y}; touches.set(e.pointerId, {role:'stick'}); }
  syncGuard();
});
// iOS Safari：ページの引っぱり・スクロールを止める（装備画面のスクロールだけは許す）
document.addEventListener('touchmove', e => { if (!e.target.closest || !e.target.closest('.card.load')) e.preventDefault(); }, {passive:false});
cv.addEventListener('pointermove', e => { if (stick && e.pointerId === stick.id) { const q = toLogical(e); stick.x = q.x; stick.y = q.y; } });
const up = e => { touches.delete(e.pointerId); if (stick && e.pointerId === stick.id) stick = null; syncGuard(); };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
function syncGuard(){ P.guardTouch = [...touches.values()].some(t => t.role === 'grd'); }
addEventListener('keydown', e => { if (e.repeat) return; keys[e.code] = true;
  if (e.code === 'KeyJ') P.attack = true; if (e.code === 'KeyL' || e.code === 'Space') { P.dash = true; e.preventDefault(); } });
addEventListener('keyup', e => { keys[e.code] = false; });
function readPlayer(){
  let mx = 0, my = 0;
  if (stick) { const dx = stick.x - stick.ox, dy = stick.y - stick.oy, l = Math.hypot(dx, dy), m = Math.min(l, 40)/40; if (l > 4) { mx = dx/l*m; my = dy/l*m; } }
  if (keys.KeyA || keys.ArrowLeft) mx -= 1; if (keys.KeyD || keys.ArrowRight) mx += 1;
  if (keys.KeyW || keys.ArrowUp) my -= 1; if (keys.KeyS || keys.ArrowDown) my += 1;
  P.mx = mx; P.my = my; P.guard = !!(P.guardTouch || keys.KeyK);

}

// ================= ループ =================
function update(rdt){
  if (!G) return;
  G.shake = Math.max(0, G.shake - rdt);
  for (const t of G.texts) { t.y -= 30*rdt; t.life -= rdt; } G.texts = G.texts.filter(t => t.life > 0);
  if (G.hitstop > 0) { G.hitstop -= rdt; return; }
  let dt = rdt; if (G.slowT > 0) { G.slowT -= rdt; dt *= .3; }
  for (const f of G.fx) { f.x += f.vx*dt; f.y += f.vy*dt; f.vx *= .9; f.vy *= .9; f.life -= dt; } G.fx = G.fx.filter(f => f.life > 0);
  G.phaseT += rdt;
  if (G.phase === 'intro') { if (G.phaseT > 1.2) { G.phase = 'fight'; } return; }
  if (G.phase === 'ko') { stepF(G.p, G.e, dt); stepF(G.e, G.p, dt); if (G.phaseT > 1.6) endRound(); return; }
  G.now += dt;
  control(G.p, G.e, readPlayer(), dt);
  control(G.e, G.p, aiThink(dt), dt);
  stepF(G.p, G.e, dt); stepF(G.e, G.p, dt);
  updateItems(dt);
  // 体の重なりを押し戻す
  const dx = G.e.x - G.p.x, dy = G.e.y - G.p.y, d = Math.hypot(dx, dy), m = G.p.r + G.e.r;
  if (d < m && d > 0) { const k = (m - d)/2; G.p.x -= dx/d*k; G.p.y -= dy/d*k; G.e.x += dx/d*k; G.e.y += dy/d*k; }
}
function endRound(){
  if (G.pw >= 2 || G.ew >= 2) {
    const win = G.pw >= 2;
    if (win && G.level + 1 > bestLv) { bestLv = G.level + 1; try { localStorage.setItem('maai_best', bestLv); } catch(e) {} }
    G.phase = 'over';
    // 負けたら同じ相手（武器・防具とも）ともう一度。勝ったら新しい相手
    const lv = win ? G.level + 1 : G.level, eW = win ? null : G.eW, eGear = win ? null : G.eGear;
    card(win ? `<h2>勝利</h2><p>${G.e.name} を ${G.pw}-${G.ew} で倒しました。<br>次の相手は少し強くなります。</p><button id="b1">次の相手（Lv${lv}）を見る</button>`
             : `<h2>敗北</h2><p>${G.e.name} に ${G.pw}-${G.ew} で負けました。<br>装備を見直して、もう一度挑めます。</p><button id="b1">装備を見直す</button>`,
         () => loadout(lv, eW, eGear));
    return;
  }
  G.round++; newRound();
}
function card(html, fn){ ov.innerHTML = `<div class="card">${html}</div>`; ov.hidden = false; document.getElementById('b1').onclick = fn; }

// 装備画面：次の相手を見てから、武器と防具を選ぶ
function statsOf(wk, gear, bonus = 0){   // bonus：プレイヤーだけのはじき受付の上乗せ
  const w = WEAPONS[wk], m = calcMods(gear);
  return { hp: 100 + m.hp, st: 100 + m.stMax, speed: Math.round(w.speed*m.speed), taken: Math.round(m.dmgTaken*100),

           dashDist: Math.round(m.dashDist*100), guard: Math.round(w.guardMul*m.guardMul*100), stRegen: Math.round(m.stRegen*100),
           knock: Math.round(m.knock*100), stun: Math.round(m.stunMul*100) };
}

  if (!inArc) return;

  const ready = parryOpen(me) || G.now - me.guardStart > parryRearm(me);
  const now = left <= parryWin(me) && ready, R = me.r + 5 + 42*Math.min(1, left/Math.max(A.wind, .3));

// 体の動き（絵は1枚のまま、傾け・伸び縮み・弾みで動きを出す）

function pose(f){
  let rot = 0, sx = 1, sy = 1, bob = 0;
  const A = f.w.atk[f.atk], heavy = !!A.heavy;
  const ease = k => k*k*(3 - 2*k);
  if (f.state === 'idle') {
    if (f.guard) { sy = .93; sx = 1.05; rot = -.07; }                           // ガード：かがんで腰を引く
    else if (f.moveSpd > 25) {                                                  // 歩き：弾んで左右に揺れる
      const s = Math.sin(f.walkPh), k = Math.min(1, f.moveSpd/120);

    ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = ok ? '#8FE3FF' : '#7A828C';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.strokeText(ok ? '回避で抜けられる' : 'スタミナ不足', f.x, f.y + f.r + 26);
    ctx.fillText(ok ? '回避で抜けられる' : 'スタミナ不足', f.x, f.y + f.r + 26);
  }
  ctx.globalAlpha = 1;
  // スタミナ
  const bw = 36; ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(f.x - bw/2, f.y + f.r + 7, bw, 5);
  ctx.fillStyle = f.stFlash > 0 ? '#FF5A4E' : (f.st < 25 ? '#E8893A' : '#E8D25A'); ctx.fillRect(f.x - bw/2, f.y + f.r + 7, bw*f.st/f.stMax, 5);
}
function drawHUD(){
  ctx.fillStyle = '#1E222A'; ctx.fillRect(0, 0, W, 76);
  const bar = (x, w, v, c, right) => { ctx.fillStyle = '#0E1014'; ctx.fillRect(x, 36, w, 12); ctx.fillStyle = c;
    const vw = w*Math.max(0, v)/100; ctx.fillRect(right ? x + w - vw : x, 36, vw, 12); };
  bar(12, 150, G.p.hp/G.p.maxHp*100, "#3E8EDE", false); bar(198, 150, G.e.hp/G.e.maxHp*100, "#E0493E", true);
  ctx.font = '800 13px "M PLUS Rounded 1c", sans-serif'; ctx.fillStyle = '#EDE6D6';
  ctx.textAlign = 'left'; ctx.fillText(G.p.name, 12, 26); ctx.textAlign = 'right'; ctx.fillText(G.e.name, W - 12, 26);
  const pips = (x, n, c, dir) => { for (let i=0;i<2;i++){ ctx.fillStyle = i < n ? c : '#3A3F49'; ctx.beginPath(); ctx.arc(x + dir*i*14, 62, 5, 0, Math.PI*2); ctx.fill(); } };
  pips(18, G.pw, '#E8B23A', 1); pips(W - 18, G.ew, '#E8B23A', -1);
  // 強化の残り時間（丸いアイコンの周りの弧）
  const buffIcons = (f, x, dir) => { let i = 0;
    for (const k of ['atk', 'spd', 'st']) { const b = f.buffs[k]; if (b <= 0) continue; const cx = x + dir*i*20, I = ITEMS[k];
      ctx.fillStyle = I.color; ctx.beginPath(); ctx.arc(cx, 62, 7, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = I.color; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, 62, 9.5, -Math.PI/2, -Math.PI/2 + Math.PI*2*b/BUFF_T); ctx.stroke();
      ctx.fillStyle = '#FFFFFF'; ctx.font = '9px "Dela Gothic One", sans-serif'; ctx.textAlign = 'center'; ctx.fillText(I.icon, cx, 65); i++; } };
  buffIcons(G.p, 54, 1); buffIcons(G.e, W - 54, -1);
  ctx.textAlign = 'center'; ctx.fillStyle = '#8A93A0'; ctx.font = '800 11px "M PLUS Rounded 1c", sans-serif';
  ctx.fillText(G.practice ? `練習　はじき${G.count.parry}　被弾${G.count.taken}　命中${G.count.given}` : '先に2本取った方が勝ち', W/2, 66);
}
function drawControls(){
  const y0 = 430;
  ctx.fillStyle = '#1B1F26'; ctx.fillRect(0, y0, W, H - y0);
  ctx.textAlign = 'center';
  // 左：移動スティック（押した場所が中心になる）
  const sx = stick ? stick.ox : 88, sy = stick ? stick.oy : 548;
  ctx.fillStyle = 'rgba(237,230,214,.08)'; ctx.beginPath(); ctx.arc(sx, sy, 44, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(237,230,214,.25)'; ctx.lineWidth = 2; ctx.stroke();
  let kx = sx, ky = sy; if (stick) { const dx = stick.x - sx, dy = stick.y - sy, l = Math.hypot(dx, dy), m = Math.min(l, 40); if (l > 0) { kx = sx + dx/l*m; ky = sy + dy/l*m; } }
  ctx.fillStyle = 'rgba(237,230,214,.35)'; ctx.beginPath(); ctx.arc(kx, ky, 18, 0, Math.PI*2); ctx.fill();
  if (!stick) { ctx.font = '800 11px "M PLUS Rounded 1c", sans-serif'; ctx.fillStyle = '#8A93A0'; ctx.fillText('移動', sx, sy + 62); }
  // 右：ボタン
  const held = k => [...touches.values()].some(t => t.role === k) || (k === 'grd' && keys.KeyK);
  const col = {atk:'#C8463C', grd:'#3E7FC4', dash:'#5B6573'};
  for (const k in BTN) { const b = BTN[k], on = held(k);
    ctx.fillStyle = col[k]; ctx.globalAlpha = on ? 1 : .85; ctx.beginPath(); ctx.arc(b.x, b.y + (on ? 2 : 0), b.r, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1; ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = '#F4EEDF'; ctx.font = `${k === 'atk' ? 17 : 13}px "Dela Gothic One", sans-serif`; ctx.fillText(b.label, b.x, b.y + (k === 'atk' ? 6 : 5) + (on ? 2 : 0)); }
  ctx.font = '800 10px "M PLUS Rounded 1c", sans-serif'; ctx.fillStyle = '#6E7785';
  ctx.fillText('キーボード：WASD移動 / J攻撃 / Kガード / Space回避', W/2, H - 10);
}

let last = performance.now();
function loop(now){ const dt = Math.min(.05, (now - last)/1000); last = now; update(dt); draw(); requestAnimationFrame(loop); }

    <li><b>回避</b>は一瞬無敵。スティックの方向へ跳ぶ</li>
    <li>攻撃・ガード・回避はすべてスタミナ（足元の黄色いバー）を使う</li>
    <li>試合の前に、次の相手を見てから<b>武器と防具</b>（A部・B部・C部）を選ぶ</li>
    <li>ときどき<b>アイテム</b>が落ちてくる。回復・攻撃力UP・速度UP・スタミナ。相手より先に拾え</li>

  <button id="b1">装備を選んで勝負</button><br>
  <button id="b2" class="sub">練習する（体力が減らない）</button>`, () => loadout(1));
document.getElementById('b2').onclick = openPractice;
}
addEventListener('keydown', e => { if (e.code === 'Escape') quitPractice(); });   // 練習中は Esc でもやめられる
title();
requestAnimationFrame(loop);
