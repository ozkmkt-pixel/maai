<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="間合い">
<meta name="theme-color" content="#15181D">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<meta charset="utf-8">
<title>間合い</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
  :root{ color-scheme: dark; --bg:#15181D; --ink:#EDE6D6; --paper:#F4EEDF; --dark:#1E222A; --red:#E0493E; --blue:#3E8EDE; --gold:#E8B23A; }
  html,body{height:100%;overscroll-behavior:none;}
  /* iPhone でスティックの指がずれても画面ごと上下しないように、ページを固定する */
  body{position:fixed;inset:0;width:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"M PLUS Rounded 1c",system-ui,sans-serif;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
  #app{position:relative;height:100%;display:flex;align-items:center;justify-content:center;}
  canvas{display:block;touch-action:none;}
  #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,12,15,.6);padding:16px;}
  #overlay[hidden]{display:none;}
  #quit{position:absolute;margin:0;padding:6px 14px;font-size:12px;border-radius:9px;background:#3A3F49;box-shadow:0 3px 0 #000;z-index:2;}
  #quit[hidden]{display:none;}
  #snd{position:absolute;margin:0;padding:0;width:34px;height:34px;border-radius:50%;background:rgba(58,63,73,.85);box-shadow:none;font-size:16px;z-index:2;}
  #snd[hidden]{display:none;}
  .note{font-size:12px !important;color:#5A5E66;margin:0 0 6px !important;}
  .side{border:2px solid #D8CDB5;border-radius:12px;padding:6px 8px 10px;margin-top:10px;}
  .foeSide{border-color:#E0A89F;background:#FBEDE8;}
  .sideT{font-family:"Dela Gothic One",sans-serif;font-size:15px;text-align:left;}
  .lv{display:flex;align-items:center;justify-content:center;gap:14px;}
  .lv button{margin:0;padding:4px 16px;font-size:18px;}
  .lv b{font-size:18px;color:#23252B !important;min-width:52px;}
  .card{background:var(--paper);color:#23252B;border-radius:16px;padding:22px 20px;max-width:340px;width:100%;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.45);}
  .card h1{font-family:"Dela Gothic One",sans-serif;font-size:40px;margin:0 0 4px;letter-spacing:.06em;}
  .card h2{font-family:"Dela Gothic One",sans-serif;font-size:26px;margin:0 0 6px;}
  .card p{margin:8px 0;line-height:1.6;font-size:14px;}
  .card ul{text-align:left;padding-left:1.2em;margin:10px 0;font-size:13px;line-height:1.7;}
  .card b{color:#B8322A;}
  button{font:inherit;cursor:pointer;border:0;border-radius:12px;background:#23252B;color:var(--paper);font-weight:800;font-size:17px;padding:12px 28px;margin-top:10px;box-shadow:0 4px 0 #000;}
  button:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
  button.sub{background:transparent;color:#23252B;box-shadow:none;border:2px solid #23252B;font-size:14px;padding:8px 20px;}
  .card.load{max-height:100%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:16px 14px;box-sizing:border-box;}
  .card h3{font-size:13px;margin:12px 0 5px;text-align:left;color:#5A5E66;}
  .foe{background:#2B2F37;color:#F4EEDF;border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.6;}
  .foe b{color:#FF9B8F;}
  .grow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
  .grow.g4{grid-template-columns:repeat(2,1fr);}
  .gbtn{margin:0;padding:7px 5px;display:flex;flex-direction:column;gap:2px;align-items:center;background:#E4DCC9;color:#23252B;box-shadow:0 3px 0 #B9AE95;border-radius:10px;}
  .gbtn span{font-family:"Dela Gothic One",sans-serif;font-size:16px;font-weight:400;}
  .gbtn small{font-size:10px;line-height:1.35;font-weight:800;}
  .gbtn .pro{color:#2F7A45;} .gbtn .con{color:#B8322A;}
  .gbtn.on{background:#23252B;color:#F4EEDF;box-shadow:0 3px 0 #000;}
  .gbtn.on .pro{color:#8FE0A6;} .gbtn.on .con{color:#FF9B8F;}
  .stats{width:100%;border-collapse:collapse;font-size:12px;color:#23252B;}
  .catprev{display:flex;justify-content:center;gap:10px;margin-top:12px;}
  .catprev figure{margin:0;background:#C9B48A;border-radius:12px;padding:4px 4px 2px;text-align:center;}
  .catprev canvas{width:96px;height:109px;display:block;}
  .skrow{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:4px 0;}
  .skrow b{font-size:11px;width:30px;text-align:left;color:#23252B;}
  .gbtn.skin{flex-direction:row;padding:5px 8px;font-size:11px;font-weight:800;}
  .gbtn.skin i{display:inline-block;width:10px;height:10px;border-radius:50%;border:1px solid #15181D;margin-right:3px;}
  .card h2.pl{font-family:"M PLUS Rounded 1c",sans-serif;font-weight:900;}   /* 見出しの字体に「店」「蔵」「極」などの字がないので */
  .skrow em{font-size:10px;color:#8A8F98;font-style:normal;margin-left:2px;}
  .gbtn.lock{opacity:.5;box-shadow:none;cursor:default;}
  .coin{display:inline-block;background:#2B2F37;color:#F4EEDF;border-radius:20px;padding:4px 14px;font-size:13px;font-weight:800;margin:4px 0;}
  .coin b{color:#FFD84A !important;}
  .earn{background:#FFF6D8;border-radius:10px;padding:8px;font-size:14px !important;}
  .earn small{display:block;font-size:11px;color:#6A5A2A;}
  .row2,.row3{display:flex;gap:8px;justify-content:center;}
  .row2 button,.row3 button{flex:1;padding:10px 6px;font-size:15px;}
  .row2 button small{display:block;font-size:11px;opacity:.8;}
  button:disabled{opacity:.4;cursor:default;}
  .box{width:120px;height:120px;margin:10px auto;border-radius:14px;background:linear-gradient(#7A2E2A,#5A1E1A);box-shadow:0 6px 0 #3A120F;display:flex;align-items:center;justify-content:center;transition:box-shadow .3s;}
  .boxIn{font-family:"M PLUS Rounded 1c",sans-serif;font-weight:900;color:#F4EEDF;font-size:26px;writing-mode:vertical-rl;letter-spacing:.2em;}
  .box.shake{animation:shake .12s linear infinite;}
  .box.glow0{box-shadow:0 0 30px 8px #C9CED6;} .box.glow1{box-shadow:0 0 34px 12px #3E8EDE;} .box.glow2{box-shadow:0 0 50px 20px #FFD84A;background:linear-gradient(#E8B23A,#B8860B);}
  @keyframes shake{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}100%{transform:rotate(-8deg)}}
  .card.kiwami{animation:kiwami .8s ease-out;}
  @keyframes kiwami{0%{box-shadow:0 0 0 0 #FFD84A;transform:scale(1.04)}100%{box-shadow:0 8px 0 rgba(0,0,0,.45);transform:scale(1)}}
  .res{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:8px 0;}
  .res.one{grid-template-columns:1fr;justify-items:center;}
  .res figure{margin:0;background:#C9B48A;border-radius:8px;padding:2px;border:2px solid transparent;}
  .res figure.r1{border-color:#3E7FC4;} .res figure.r2{border-color:#FFD84A;background:#E8D28A;box-shadow:0 0 10px #FFD84A;}
  .res canvas{display:block;margin:0 auto;width:100% !important;height:auto !important;}
  .res.one canvas{width:110px !important;}
  .res figure{min-width:0;}
  .res figcaption{font-size:9px;font-weight:800;line-height:1.3;color:#23252B;}
  .res figcaption small{display:block;font-size:8px;color:#5A4A33;}
  .res.one figcaption{font-size:14px;} .res.one figcaption small{font-size:11px;}
  .rare{font-style:normal;color:#FFF;border-radius:4px;padding:0 3px;margin-right:2px;font-size:9px;}
  .tabs{display:flex;gap:4px;margin:8px 0;} .tabs button{flex:1;margin:0;padding:6px 2px;font-size:13px;background:#E4DCC9;color:#23252B;box-shadow:0 3px 0 #B9AE95;}
  .tabs button.on{background:#23252B;color:#F4EEDF;box-shadow:0 3px 0 #000;}
  .shopRow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid #DDD3BE;text-align:left;}
  .shopName{flex:1;display:flex;flex-direction:column;} .shopName span{font-weight:800;font-size:14px;} .shopName small{font-size:10px;font-weight:800;}
  .shopName .pro{color:#2F7A45;} .shopName .con{color:#B8322A;}
  .shopRow button{margin:0;padding:6px 10px;font-size:13px;} .shopRow em{font-size:11px;color:#2F7A45;font-style:normal;font-weight:800;}
  .mini{background:#C9B48A;border-radius:8px;}
  .kura{display:flex;flex-wrap:wrap;gap:4px;} .kura span{font-size:11px;font-weight:800;border:2px solid #B9AE95;border-radius:8px;padding:3px 6px;background:#FFF;}
  .kura span.no{color:#A0A4AA;background:#EEE8DA;}
  .catprev figcaption{font-size:11px;font-weight:800;color:#3A2A1A;}
  .stats th{font-size:11px;color:#5A5E66;padding:2px 4px;} .stats td{padding:3px 4px;border-top:1px solid #DDD3BE;}
  .stats td:first-child{text-align:left;} .stats td:not(:first-child){text-align:right;font-weight:800;width:52px;}
  .stats .good{color:#2F7A45;} .stats .bad{color:#B8322A;}
  /* ---------- 装備画面（v0.19）：暗い舞台に自キャラ、まわりに装備の枠 ---------- */
  .eq{position:relative;width:100%;max-width:420px;height:100%;max-height:780px;border-radius:18px;overflow:hidden;color:#EDE6D6;
    background:radial-gradient(ellipse at 50% 36%, #2E3748 0%, #191C24 58%, #0F1115 100%);border:1px solid #3F3527;box-shadow:0 10px 40px rgba(0,0,0,.6);}
  .eqBody{height:100%;display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain;}
  .eq button{margin:0;box-shadow:none;}
  .eqTop{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid rgba(232,178,58,.28);background:linear-gradient(#242A35,#1A1E26);}
  .eqTop>b{flex:1;font-size:17px;letter-spacing:.12em;color:#F4E3B5;}
  .eqTop .coin{margin:0;}
  .eqBack{padding:0;width:34px;height:34px;border-radius:50%;font-size:24px;line-height:1;background:#2E3440;color:#E8B23A;}
  .eqStage{flex:1;display:grid;grid-template-columns:68px 1fr 68px;gap:4px;padding:12px 10px 0;align-items:center;min-height:300px;}
  .eqCol{display:flex;flex-direction:column;gap:9px;}
  .eqSlot{padding:0;position:relative;width:66px;height:66px;border-radius:12px;overflow:hidden;
    background:linear-gradient(145deg,#2B313D,#14171D);border:2px solid var(--rc);}
  .eqSlot canvas,.eqItem canvas{display:block;width:100%;image-rendering:pixelated;}
  .eqSlot canvas{height:100%;}
  .eqSlot i{position:absolute;left:0;right:0;bottom:0;font-style:normal;font-size:9px;font-weight:800;line-height:14px;background:rgba(0,0,0,.6);color:#D9CBA6;}
  .eqSlot.on{border-color:#FFD84A;box-shadow:0 0 12px #E8B23A;}
  .eqSlot.sm{width:54px;height:54px;border-radius:10px;}
  .eqMid{position:relative;height:100%;display:flex;align-items:center;justify-content:center;}
  #eqChar{width:200px;height:260px;max-width:100%;object-fit:contain;image-rendering:pixelated;touch-action:none;cursor:grab;}
  .eqDice{position:absolute;right:2px;top:0;padding:0;width:32px;height:32px;border-radius:50%;background:#2E3440;font-size:15px;}
  .eqChips{display:flex;justify-content:center;gap:6px;padding:10px 8px 8px;}
  .eqStats{margin:0 12px;padding:8px 12px 6px;border-radius:12px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.06);}
  .eqBar{display:grid;grid-template-columns:56px 1fr 40px;align-items:center;gap:8px;height:18px;font-size:11px;font-weight:800;}
  .eqBar span{color:#9AA3AE;} .eqBar b{text-align:right;color:#F4E3B5;}
  .eqBar em{height:6px;border-radius:3px;background:#0B0D11;overflow:hidden;} .eqBar em i{display:block;height:100%;background:linear-gradient(90deg,#B8862A,#FFD84A);}
  .eqDet{display:grid;grid-template-columns:1fr auto;gap:3px 14px;margin-top:6px;font-size:11px;color:#C9C2B0;} .eqDet b{text-align:right;color:#F4E3B5;}
  .eqLink{display:block;margin:2px auto 0 !important;padding:2px 10px;background:none;color:#E8B23A;font-size:11px;}
  .eqFoot{display:flex;align-items:center;gap:10px;padding:12px;}
  .eqVs{flex:1;text-align:left;font-size:11px;font-weight:800;color:#9AA3AE;line-height:1.5;}
  .eqVs b{display:block;font-size:14px;color:#FF9B8F;}
  .eqVs.btn{padding:6px 12px;border-radius:12px;background:rgba(0,0,0,.3);border:1px solid rgba(255,155,143,.35);}
  .eqGo{padding:14px 30px;font-size:19px;letter-spacing:.25em;border-radius:14px;background:linear-gradient(#E0493E,#A8281F);box-shadow:0 4px 0 #5A120C !important;}
  /* 一覧を開いている間：下半分が一覧、上半分にキャラと枠（キャラは隠さない） */
  .eq.open .eqBody{height:52%;} .eq.open .eqStage{min-height:0;padding-top:6px;} .eq.open .eqChips,.eq.open .eqStats,.eq.open .eqFoot{display:none;}
  .eq.open .eqSlot{width:54px;height:54px;} .eq.open .eqCol{gap:5px;} .eq.open .eqStage{grid-template-columns:56px 1fr 56px;}
  .eq.open #eqChar{height:min(260px, calc(100% - 4px));}
  .eqSheet{position:absolute;left:0;right:0;bottom:0;height:48%;display:flex;flex-direction:column;background:#1B1F27;
    border-top:2px solid #E8B23A;border-radius:18px 18px 0 0;box-shadow:0 -12px 30px rgba(0,0,0,.6);animation:eqUp .18s ease-out;}
  @keyframes eqUp{from{transform:translateY(30px);opacity:0}}
  .eqSheetHd{display:flex;align-items:center;padding:10px 14px 8px;} .eqSheetHd b{flex:1;font-size:15px;letter-spacing:.1em;color:#F4E3B5;}
  .eqSheetHd button{padding:0;width:30px;height:30px;border-radius:50%;background:#2E3440;font-size:13px;}
  .eqSheetBody{overflow-y:auto;overscroll-behavior:contain;padding:0 14px 10px;}
  .eqGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;}
  .eqSheetBody{flex:1;min-height:0;padding-top:4px;}
  /* ---------- タイトル・遊び方（v0.21） ---------- */
  .ttTop{background:transparent;border-bottom:0;} .ttSp{flex:1;}
  .ttHero{position:relative;flex:1 1 200px;min-height:190px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;}
  .ttHero .gcRays{top:50%;left:50%;margin:-230px 0 0 -230px;}
  #ttCv{position:relative;width:min(100%, 360px);image-rendering:pixelated;}
  .ttLogo{text-align:center;}
  .ttLogo h1{margin:0;font-family:"Dela Gothic One","M PLUS Rounded 1c",sans-serif;font-weight:400;font-size:62px;line-height:1.15;letter-spacing:.12em;
    background:linear-gradient(#FFF3C9 10%,#E8B23A 55%,#8E6010);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 3px 0 #3A2608) drop-shadow(0 0 18px rgba(232,178,58,.35));}
  .ttLogo p{margin:2px 0 0;font-size:11px;font-weight:800;letter-spacing:.45em;color:#9AA3AE;}
  .ttMenu{display:flex;flex-direction:column;gap:10px;padding:18px 16px 16px;}
  .ttGo{padding:12px;border-radius:16px;border:1px solid #FF9B8F;background:linear-gradient(#E0493E,#A8281F);color:#FFFFFF;font-size:24px;letter-spacing:.5em;box-shadow:0 5px 0 #5A120C !important;}
  .ttGo small{display:block;margin-top:1px;font-size:10px;letter-spacing:.1em;color:#FFD9D2;}
  .ttMelee{padding:9px;border-radius:14px;border:1px solid rgba(232,178,58,.6);background:linear-gradient(#4A3A16,#241C0A);color:#FFE7A8;font-size:18px;letter-spacing:.4em;}
  .ttMelee small{display:block;margin-top:1px;font-size:10px;letter-spacing:.05em;color:#D9CBA6;}
  .ttGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .ttGrid button{padding:12px 0;border-radius:12px;border:1px solid rgba(232,178,58,.45);background:linear-gradient(#3A4150,#232833);color:#F4E3B5;font-size:15px;font-weight:900;letter-spacing:.08em;}
  .ttSub{display:flex;justify-content:center;gap:12px;}
  .ttSub button{padding:6px 16px;border-radius:20px;border:1px solid #3F4652;background:transparent;color:#9AA3AE;font-size:12px;}
  .hpList{display:flex;flex-direction:column;gap:8px;padding:12px;}
  .hpRow{display:flex;align-items:flex-start;gap:12px;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.05);text-align:left;animation:shPop .3s ease-out backwards;}
  .hpRow b{flex:none;width:66px;font-size:13px;color:#E8B23A;} .hpRow p{margin:0;font-size:12px;line-height:1.65;color:#D9CBA6;} .hpRow p b{width:auto;font-size:12px;color:#FFD84A;}
  .hpKeys{margin-top:4px;text-align:center;font-size:10px;color:#6E7785;}
  /* ---------- ガチャ・店・蔵（v0.20） ---------- */
  .eqTop .coin{font-size:12px;padding:3px 10px;} .eqTop .coin.frag b{color:#9CCBFF !important;}
  .sh .eqBody{padding-bottom:10px;}
  .gcStage{position:relative;flex:1 1 230px;min-height:230px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .gcRays{position:absolute;width:460px;height:460px;border-radius:50%;animation:gcSpin 30s linear infinite;
    background:repeating-conic-gradient(rgba(232,178,58,.13) 0deg 9deg, transparent 9deg 18deg);
    -webkit-mask-image:radial-gradient(circle, #000 15%, transparent 62%);mask-image:radial-gradient(circle, #000 15%, transparent 62%);}
  @keyframes gcSpin{to{transform:rotate(360deg)}}
  .sh .box{position:relative;width:128px;height:128px;margin:0;border:2px solid #E8B23A;border-radius:18px;background:linear-gradient(#8A2E28,#4A1410);
    box-shadow:0 0 34px rgba(232,178,58,.35), inset 0 0 22px rgba(0,0,0,.55);}
  .sh .boxIn{color:#FFE7A8;text-shadow:0 2px 0 #3A0E0A;}
  .gcRates{display:flex;justify-content:center;gap:6px;}
  .gcRates span{padding:2px 10px;border-radius:10px;border:1px solid var(--rc);background:rgba(0,0,0,.3);color:var(--rc);font-size:11px;font-weight:800;}
  .gcPity{margin:14px 18px 0;text-align:left;font-size:11px;font-weight:800;color:#9AA3AE;} .gcPity b{font-size:15px;color:#FFD84A;}
  .gcPity em,.kuraTop em{display:block;height:6px;margin-top:5px;border-radius:3px;background:#0B0D11;overflow:hidden;}
  .gcPity em i,.kuraTop em i{display:block;height:100%;background:linear-gradient(90deg,#B8862A,#FFD84A);}
  .gcBtns{display:flex;gap:10px;padding:16px 14px 10px;}
  .gcBtn{flex:1;padding:12px 6px;border-radius:14px;border:1px solid rgba(232,178,58,.5);background:linear-gradient(#3A4150,#232833);color:#F4E3B5;font-size:18px;letter-spacing:.12em;}
  .gcBtn small{display:block;margin-top:2px;font-size:10px;letter-spacing:0;color:#D9CBA6;}
  .gcBtn.ten{border-color:#FF9B8F;background:linear-gradient(#E0493E,#A8281F);color:#FFFFFF;} .gcBtn.ten small{color:#FFD9D2;}
  .gcBtn.sub2{background:transparent;border-color:#5E5140;}
  .shNote{margin:0 16px 12px;font-size:11px;line-height:1.6;color:#8A93A0;text-align:center;} .shNote.top{margin:6px 16px 4px;}
  .gcRes{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;padding:16px 12px 0;}
  .gcRes.one{grid-template-columns:150px;justify-content:center;padding-top:36px;}
  .gcRes.one .shCard span{font-size:15px;} .gcRes.one .shCard small{font-size:11px;} .gcRes.one .shBadge{font-size:11px;}
  .shCard{position:relative;min-width:0;padding:4px 2px 5px;display:flex;flex-direction:column;align-items:center;border-radius:10px;
    background:linear-gradient(145deg,#2B313D,#14171D);border:2px solid var(--rc);animation:shPop .35s ease-out backwards;}
  @keyframes shPop{from{transform:scale(.55);opacity:0}}
  .shCard canvas{width:100%;aspect-ratio:1;image-rendering:pixelated;}
  .shCard span{max-width:100%;font-size:9px;font-weight:800;color:#EDE6D6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .shCard small{font-size:8px;color:#8A93A0;}

// <audio> は1つを使い回す（iPhone は、指で触れたときに一度鳴らした <audio> でないと、あとから鳴らせないため）
// 場面が変わったら、今の曲を小さくしてから次の曲へ（iPhone は音量を変えられないので、すぐ切り替わる）。オン／オフは効果音と同じ
const BGM_TRACKS = { title: ['bgm_title.mp3', .5], loadout: ['bgm_loadout.mp3', .42], duel: ['bgm_duel.mp3', .45], melee: ['bgm_melee.mp3', .42] };
const BGM = (() => {

function spawnItem(){
  let x, y;
  for (let i=0; i<12; i++) {   // 誰かの真上には落とさない
    // 乱戦では次の結界の輪（なければ今の輪）の中に落とす
    const z = G.zone, c = z ? (z.tr != null ? {x:z.tx, y:z.ty, r:z.tr} : z) : AR;
    const a = rnd(0, Math.PI*2), r = Math.sqrt(Math.random())*Math.max(8, Math.min(c.r, AR.r) - 22);
    x = c.x + Math.cos(a)*r; y = c.y + Math.sin(a)*r;
    const onT = G.terrain && [...G.terrain.pits, ...G.terrain.pillars].some(c => Math.hypot(x - c.x, y - c.y) < c.r + 14);
    if (!onT && (G.fs || [G.p, G.e]).every(f => f.dead || Math.hypot(x - f.x, y - f.y) > 55)) break;
  }
  const type = G.melee && Math.random() < .3 ? 'up' : IKEYS[Math.floor(Math.random()*IKEYS.length)];
  G.items.push({x, y, type, t:0});
}
function updateItems(dt){
  if (G.items.filter(it => !it.soul).length < (G.melee ? 3 : 1)) { G.itemT -= dt; if (G.itemT <= 0) { spawnItem(); G.itemT = G.melee ? rnd(3, 6) : rnd(7, 12); } }
  for (const it of G.items) {
    it.t += dt; if (it.t < DROP_T) continue;
    for (const f of (G.fs || [G.p, G.e])) {
      if (it.gone || f.dead || f.state === 'stun' || Math.hypot(f.x - it.x, f.y - it.y) > f.r + 12) continue;
      const I = ITEMS[it.type]; it.gone = true;
      let label = I.label;
      if (it.type === 'heal') f.hp = Math.min(f.maxHp, f.hp + 30);
      else if (it.type === 'st') { f.st = f.stMax; f.buffs.st = BUFF_T; }
      else if (it.type === 'up') { if (f.wlv < WLV_MAX) { f.wlv++; label = `武器強化 ${'★'.repeat(f.wlv)}`; } else { f.hp = Math.min(f.maxHp, f.hp + 20); label = '★最大 → 回復'; } }
      else f.buffs[it.type] = BUFF_T;
      say(label, f.x, f.y - 40, I.color, 18, 1.1); spark(it.x, it.y, I.color, 14, 200); if (seen(f)) SFX.pickup();

  else { ai.ptDecided = false; ai.ptThrow = false; }

  else if (ai.ptThrow && (d >= 112 || e.st < THROW.st)) ai.ptThrow = false;   // 届かない・スタミナが足りないなら、いつもどおり斬りに行く
  const openP = !ai.ptThrow && !inp.throw && ( p.state === 'stun' || (p.state === 'recover' && p.t < p.w.atk[p.atk].rec*.6) || (p.state === 'dash' && p.t > .16) || (p.state === 'throw' && p.thr === 'miss'));

  const thrD = THROW.reach + THROW.lunge + e.r + p.r - 6;
  if (!ai.throwGo && e.state === 'idle' && !ai.attackAt && e.st > THROW.st + 10 && ((ai.pGuardT > .2 && d < thrD + 45) || (p.state === 'idle' && d < thrD + 5)) && Math.random() < dt*(.5 + .1*L)*Pe.thr*(ai.pGuardT > .2 ? 4 : 1))

    if (now - ai.throwT > 1) ai.throwGo = false;

  if (ai.attackAt && now - ai.attackAt > .6) ai.attackAt = 0;

function rollOne(minR = 0){
  bag.pity++;
  const x = Math.random(); let r = x < GACHA.rates[2] ? 2 : x < GACHA.rates[2] + GACHA.rates[1] ? 1 : 0;
  if (bag.pity >= GACHA.pity) r = 2;
  r = Math.max(r, minR); if (r === 2) bag.pity = 0;
  const pool = SKIN_POOL.filter(i => i.r === r), it = pool[Math.floor(Math.random()*pool.length)];
  const dup = ownsSkin(it.slot, it.key);
  if (dup) bag.frag += FRAG_GET[r]; else bag.skins[it.slot + ':' + it.key] = 1;
  return {...it, dup};
}

function pull(n){
  const cost = n === 1 ? GACHA.one : GACHA.ten; if (bag.koban < cost) return;
  bag.koban -= cost;
  const res = []; for (let i = 0; i < n; i++) res.push(rollOne(n === 10 && i === 9 && !res.some(x => x.r >= 1) ? 1 : 0));
  saveBag();
  const best = Math.max(...res.map(x => x.r));
  // 箱を振る → いちばん良い等級の色で光る → 札が出る
  ov.querySelectorAll('button').forEach(b => b.disabled = true);
  gachaShow(best, 0, () => showResults(res, n, best));   // v0.38 演出（見た目は並・上・極）
}

function dailyItems(){
  const d = new Date(), seed0 = d.getFullYear()*10000 + (d.getMonth() + 1)*100 + d.getDate();
  let seed = seed0; const rnd1 = () => (seed = (seed*1103515245 + 12345) % 2147483648) / 2147483648;
  const pick = [], pool = [...SKIN_POOL];
  for (let i = 0; i < 3; i++) pick.push(pool.splice(Math.floor(rnd1()*pool.length), 1)[0]);
  return pick;
}

// ================= 通信対戦（v0.34 試作、v0.34.1 で仕掛け・v0.34.2 で心臓と鍔玉も自分のもの） =================
// 2台をコードでつなぐ1対1。PeerJS（WebRTC）で直接つなぎ、仲介は PeerJS の無料サーバー（部屋のコードの受け渡しだけ）
// 作りはホストが全部を計算する方式：ホストが試合を進め、参加側は入力を送って、届いた様子を描くだけ
//   参加側の画面は闘技場の中心で180度回して、自分がいつも下（青）に見えるようにする

const NET_VER = 3, NET_PREFIX = 'maai-v1-', NET_GEAR = { A: 'a2', B: 'b2', C: 'c2' };

let NET = null;   // { role:'host'|'guest', peer, conn, opp:{skin,w}, rin, seen, sfx, lastSend, again:{me,opp} }

function netLoadLib(){
  if (window.Peer) return Promise.resolve();
  return new Promise((ok, ng) => { const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js'; s.onload = ok; s.onerror = () => ng(new Error('通信の部品を読み込めませんでした'));
    document.head.appendChild(s); });
}
function netClose(){
  if (!NET) return; const n = NET; NET = null;

}
// 自分から抜ける：相手に知らせ、少し後に閉じる（閉じたときの「切れました」は出さない）
function netBye(){ netSend({ t: 'bye' }); const n = NET; if (n) n.left = true; setTimeout(() => { if (NET === n) netClose(); }, 200); }
const netSend = m => { try { if (NET && NET.conn && NET.conn.open) NET.conn.send(m); } catch(e) {} };

// ---------- 画面：部屋を作る／部屋に入る ----------

    <div class="nLbl">使う武器</div><div class="nWs">${wBtns}</div>

    ov.querySelectorAll('.nW').forEach(x => x.classList.toggle('on', x === b)); SFX.coin(); });

const netStatus = (html) => { const el = document.getElementById('nSt'); if (el) el.innerHTML = html; };
function netFail(text){
  if (NET && NET.left) return netClose();
  if (NET && NET.overShown) { const el = document.getElementById('nAg'); if (el) el.textContent = '相手は対戦を抜けました'; const b = document.getElementById(NET.ran ? 'bA' : 'b1'); if (b) b.disabled = true; netClose(); return; }   // 勝負がついた後に相手が抜けた
  if (NET && NET.ran) return ranFail(text);

  if (wasPlaying) card(`<h2>通信が切れました</h2><p>${text}</p><button id="b1">タイトルへ</button>`, title); else netStatus(`<span class="ng">${text}</span>`); }

async function netHost(){
  netClose(); netStatus('準備中…');
  try { await netLoadLib(); } catch(e) { return netStatus(`<span class="ng">${e.message}</span>`); }
  const tryOpen = (n) => {
    const code = Array.from({length: 4}, () => NET_CODE_CH[Math.floor(Math.random()*NET_CODE_CH.length)]).join('');
    const peer = new Peer(NET_PREFIX + code);
    NET = { role: 'host', peer, code };
    peer.on('open', () => netStatus(`部屋のコード<div class="nCodeBig">${code}</div>相手がこのコードで入るのを待っています…`));
    peer.on('error', err => { if (err.type === 'unavailable-id' && n < 4) { peer.destroy(); tryOpen(n + 1); } else netFail('つながりませんでした（' + (err.type || err) + '）'); });
    peer.on('connection', conn => {
      if (NET.conn) { conn.on('open', () => { conn.send({ t: 'full' }); setTimeout(() => conn.close(), 300); }); return; }
      NET.conn = conn; netWire(conn);
    });
  };
  tryOpen(0);
}
async function netJoin(code){
  code = (code || '').toUpperCase(); if (code.length !== 4) return netStatus('<span class="ng">コードは4文字です</span>');
  netClose(); netStatus('接続中…');
  try { await netLoadLib(); } catch(e) { return netStatus(`<span class="ng">${e.message}</span>`); }
  const peer = new Peer();
  NET = { role: 'guest', peer, code };
  peer.on('error', err => netFail(err.type === 'peer-unavailable' ? 'その部屋は見つかりませんでした' : 'つながりませんでした（' + (err.type || err) + '）'));
  peer.on('open', () => { const conn = peer.connect(NET_PREFIX + code, { reliable: true, serialization: 'json' }); NET.conn = conn; netWire(conn);
    setTimeout(() => { if (NET && NET.conn === conn && !conn.open) netFail('相手に届きませんでした（ネットワークによっては直接つながりません）'); }, 15000); });
}
function netWire(conn){
  conn.on('open', () => { netStatus('つながりました。始めます…'); netHello(conn); });
  conn.on('data', netRecv);
  conn.on('close', () => { if (NET && NET.conn === conn) netFail('相手との接続が切れました'); });
  conn.on('error', () => { if (NET && NET.conn === conn) netFail('通信でエラーが起きました'); });
}
function netHello(conn){ syncGear(); conn.send({ t: 'hello', v: NET_VER, skin: mySkin, w: myW, gear: netGearOut(myGear), heart: myHeart(), orb: myOrb() }); }
function netRecv(m){
  if (!NET || !m) return;
  if (m.t === 'full') return netFail('その部屋はもう対戦中です');
  if (m.t === 'busy') return netFail('相手は今、乱入を受け付けていません');
  if (m.t === 'hello') {
    if (m.v !== NET_VER) { netSend({ t: 'ver' }); return netFail('相手とゲームの版が違います。どちらも読み込み直してください'); }
    NET.opp = { skin: { ...DEFAULT_SKIN, ...(m.skin || {}) }, w: WEAPONS[m.w] ? m.w : 'katana', gear: netGearIn(m.gear), heart: netKLv(m.heart, HEARTS), orb: netKLv(m.orb, ORBS) };
    if (NET.role === 'host') { if (NET.ran) ranBegin(); else netStart(); }
    return;
  }
  if (m.t === 'ver') return netFail('相手とゲームの版が違います。どちらも読み込み直してください');
  if (m.t === 'in') { NET.rin = m; return; }
  if (m.t === 'start') return netStart();
  if (m.t === 's') return netApply(m);
  if (m.t === 'again') { NET.again.opp = true; netAgainCheck(); return; }
  if (m.t === 'bye') return netFail('相手が対戦をやめました');
}

// ---------- 試合の始まり（ホストもゲストも同じ形で G を作る。ゲストは中身を受け取ったもので上書きする） ----------
function netStart(){

  G.e = netMk(AR.y - 80, Math.PI/2, NET.opp.w, NET.opp.skin, 'red', `${NET.ran && NET.role === 'host' ? '乱入者' : '相手'}（${WEAPONS[NET.opp.w].name}）`, NET.opp.gear, NET.opp.heart, NET.opp.orb);

function netMk(y, face, wk, skin, team, name, gear, heart, orb){
  const f = mkF(AR.x, y, false, TEAM[team], name, wk, gear);   // isAI=false：ふたりともプレイヤー扱い（はじき受付の上乗せも同じ）

// 仕掛け：送るのは能力に関わる所だけ。受け取ったものは中身を確かめ、おかしな部位は最初の型にする
const netGearOut = g => Object.fromEntries(SLOTS.map(s => { const x = asItem(g[s]) || {}; return [s, { s, k: x.k, r: x.r || 0, lv: x.lv || 0, subs: x.subs || [], sp: x.sp || null, set: x.set || null }]; }));
function netGearIn(g){

    return [s, { s, k: x.k, r: +x.r || 0, lv: +x.lv || 0, subs, sp: SPECIALS[x.sp] ? x.sp : null, set: SETS[x.set] ? x.set : null }]; }));

// 心臓・鍔玉：{k, lv}。知らない種類なら持っていない扱い
const netKLv = (x, table) => x && table[x.k] ? { k: x.k, lv: clamp(Math.round(+x.lv || 0), 0, 5) } : null;
// ホスト：相手（G.e）の入力。押した回数の数え上げが増えていたら、その操作を1回出す
function netInput(){
  const r = NET.rin, s = NET.seen, o = { mx: r.mx || 0, my: r.my || 0, guard: !!r.g, attack: r.a !== s.a, dash: r.d !== s.d, throw: r.th !== s.th, ougi: (r.o || 0) !== s.o };

  G.round++; netRound();

// ---------- 毎フレーム（loop から） ----------
function netTick(){
  if (!G || !G.net || !NET) return;
  const now = performance.now();
  if (NET.role === 'host') {
    if (G.phase !== 'fight') { const r = NET.rin; NET.seen = { a: r.a, d: r.d, th: r.th, o: r.o || 0 }; }   // 戦っていない間に押したものは捨てる
    if (now - NET.lastSend >= 15) { NET.lastSend = now; netSnap(); }
  } else {
    const p = readPlayer(), q = NET.inSeq;
    if (P.attack) { q.a++; P.attack = false; } if (P.dash) { q.d++; P.dash = false; } if (P.throw) { q.th++; P.throw = false; } if (P.ougi) { q.o++; P.ougi = false; }
    // 画面を180度回しているので、スティックの向きも逆にして送る
    const m = { t: 'in', mx: Math.round(-p.mx*100)/100, my: Math.round(-p.my*100)/100, g: !!p.guard, a: q.a, d: q.d, th: q.th, o: q.o }, key = JSON.stringify(m);

// ホスト → ゲスト：試合の様子。新しく出た火花・文字・輪と、鳴らした音はその分だけ送る
const NET_SKIP = new Set(['w', 'm', 'gear', 'skin', 'name', 'team', 'isAI', 'color', 'heart', 'orb', 'per', 'lastHit', 'heldBy', 'rushTgt', 'burnBy', 'tgt', 'ai', 'fxT', 'auT']);   // fxT・auT：演出の時計（端末ごと）
const r3 = v => typeof v === 'number' ? Math.round(v*1000)/1000 : v;
function netPackF(f){
  const o = {};
  for (const k in f) { if (NET_SKIP.has(k)) continue; const v = f[k]; if (typeof v === 'function') continue;
    if (Array.isArray(v)) o[k] = v.map(p => (p && typeof p === 'object') ? { x: r3(p.x), y: r3(p.y) } : r3(p));
    else if (v && typeof v === 'object') { const c = {}; for (const j in v) if (typeof v[j] !== 'object') c[j] = r3(v[j]); o[k] = c; }
    else o[k] = r3(v); }

}
function netFresh(arr){ const out = []; for (const o of arr || []) if (!o._n) { o._n = 1; const c = {}; for (const k in o) if (k !== '_n') c[k] = r3(o[k]); out.push(c); } return out; }
function netSnap(force){
  const s = { t: 's', ph: G.phase, pt: r3(G.phaseT), rd: G.round, pw: G.pw, ew: G.ew, now: r3(G.now), hs: r3(G.hitstop), sl: r3(G.slowT), sh: r3(G.shake), mk: r3(G.mikiriT || 0),
    p: netPackF(G.p), e: netPackF(G.e), it: G.items.map(i => ({ x: r3(i.x), y: r3(i.y), type: i.type, t: r3(i.t) })),
    fx: netFresh(G.fx), tx: netFresh(G.texts), rg: netFresh(G.rings), ofx: netFresh(G.ofx), sfx: NET.sfx };

}
// ゲスト：届いた様子を、闘技場の中心で180度回して自分の画面に置く
const mX = x => 2*AR.x - x, mY = y => 2*AR.y - y, mA = a => a == null ? a : a + Math.PI;
function netMirror(o){ if (o.x != null) o.x = mX(o.x); if (o.y != null) o.y = mY(o.y); if (o.vx != null) o.vx = -o.vx; if (o.vy != null) o.vy = -o.vy; return o; }
function netUnpackF(base, s){
  const f = { ...s, w: base.w, m: base.m, gear: base.gear, skin: base.skin, name: base.name, team: base.team, isAI: false, color: base.color, heart: base.heart, orb: base.orb, fxT: base.fxT, auT: base.auT };
  netMirror(f); f.kx = -(s.kx || 0); f.ky = -(s.ky || 0);
  f.face = mA(s.face); f.dashDir = mA(s.dashDir); if (s.rushDir != null) f.rushDir = mA(s.rushDir);
  f.trail = (s.trail || []).map(p => ({ x: mX(p.x), y: mY(p.y) }));
  return f;
}
const NET_SFX_X = { swing: 2, hit: 1, guard: 0, parry: 0, guardBreak: 0, dash: 0, escape: 0, poke: 0, charge: 0 };
function netApply(s){
  if (!G || !G.net) return;
  if (s.rd !== G.round) { G.round = s.rd; G.fx = []; G.texts = []; G.rings = []; G.items = []; G.ofx = []; }
  G.phase = s.ph; G.phaseT = s.pt; G.pw = s.ew; G.ew = s.pw; G.now = s.now; G.hitstop = s.hs; G.slowT = s.sl; G.shake = s.sh; G.mikiriT = s.mk || 0;
  G.p = netUnpackF(G.p, s.e); G.e = netUnpackF(G.e, s.p);   // ゲストの自分＝ホストの G.e
  G.items = s.it.map(netMirror);
  for (const q of s.fx) G.fx.push(netMirror(q));
  for (const q of s.tx) G.texts.push(netMirror(q));
  for (const q of s.rg) G.rings.push(netMirror(q));
  for (const q of s.ofx || []) { q.x = mX(q.x); q.y = mY(q.y); G.ofx.push(q); }   // 鍔玉の粒：位置だけ回す（炎が上へ、しずくが下へ落ちるのはそのまま）
  for (const [k, a] of s.sfx) { const i = NET_SFX_X[k]; if (i != null && typeof a[i] === 'number') a[i] = mX(a[i]); try { NET_SFX_RAW[k](...a); } catch(e) {} }
  if (s.ph === 'over' && !NET.overShown) netOver();
}
// ゲストの update：試合は進めず、火花や文字だけ動かす（試合の中身はホストから届く）
function netGuestUpdate(rdt){
  for (const q of G.ofx) { q.life -= rdt; q.x += q.vx*rdt; q.y += q.vy*rdt; q.vy += (q.g || 0)*rdt; q.vx *= q.drag || 1; }
  G.ofx = G.ofx.filter(q => q.life > 0); if (G.ofx.length > 500) G.ofx.splice(0, G.ofx.length - 500);
  for (const t of G.texts) { t.y -= 30*rdt; t.life -= rdt; } G.texts = G.texts.filter(t => t.life > 0);
  let dt = rdt; if (G.hitstop > 0) dt = 0; else if (G.slowT > 0) dt *= .3;
  for (const f of G.fx) { f.x += f.vx*dt; f.y += f.vy*dt; f.vx *= .9; f.vy *= .9; f.life -= dt; } G.fx = G.fx.filter(f => f.life > 0);
  for (const r of G.rings) r.life -= dt; G.rings = G.rings.filter(r => r.life > 0);
  if (G.phase !== 'fight') { P.attack = false; P.dash = false; P.throw = false; P.ougi = false; }
}
// ホストで鳴った音を記録してゲストへ送る（元の関数は NET_SFX_RAW に取っておく）
const NET_SFX_RAW = {};
for (const k of ['swing', 'charge', 'hit', 'poke', 'guard', 'parry', 'guardBreak', 'dash', 'escape', 'pickup', 'ko', 'start']) {
  const fn = SFX[k]; if (typeof fn !== 'function') continue; NET_SFX_RAW[k] = fn;
  SFX[k] = (...a) => { if (G && G.net && NET && NET.role === 'host') NET.sfx.push([k, a.map(r3)]); return fn(...a); };
}

// ================= 乱入（v0.35 試作） =================
// 普段は CPU 戦。「乱入受付」がオンなら、1対1の CPU 戦の間だけ PeerJS の無料サーバーに「待ち席」を取る
//   待ち席は決まった名前（maai-r3-0〜11）。一覧を出せる仲介サーバーがいらない（アカウント不要）
//   乱入する側は12席に一度に声をかけ、最初に応えた人の試合に入る。使われていない席は「いない」とすぐ返る
// 乱入を受けた側がホスト（試合を計算する）。CPU 戦はその場で止めて取っておき、乱入戦が終わったら続きから
const RAN_PREFIX = 'maai-r' + NET_VER + '-', RAN_SLOTS = 12, RAN_PAY = 40;
let RAN = null;          // 待ち席 { peer, slot, open, pend }
let RAN_HOLD = null;     // 乱入で止めた CPU 戦の G
let ranPref = true, ranWantAt = 0, ranRetryAt = 0;
try { ranPref = localStorage.getItem('maai_ran') !== '0'; } catch(e) {}
const ranShuffle = n => { const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// ---------- 受ける側：待ち席 ----------
const ranDuel = () => G && !G.net && !G.melee && !G.practice;   // 1対1の CPU 戦（練習・乱戦は除く）
const ranReady = () => ranDuel() && ov.hidden && (G.phase === 'intro' || G.phase === 'fight') && !NET && !RAN_HOLD;
function ranTick(){
  const now = performance.now(), want = ranPref && ranDuel() && !RAN_HOLD;
  if (want) ranWantAt = now;
  if (RAN && RAN.pend) return;
  if (want && !RAN && now > ranRetryAt) ranOpen();
  else if (RAN && RAN.open && !want && now - ranWantAt > 8000) ranCloseLobby();   // 装備を選ぶ間などは少し待ってから席を返す
  ranTagSync();
}
function ranCloseLobby(){ if (!RAN) return; const r = RAN; RAN = null; try { r.peer && r.peer.destroy(); } catch(e) {} ranTagSync(); }
async function ranOpen(){
  RAN = { open: false };
  const me = RAN;
  try { await netLoadLib(); } catch(e) { RAN = null; ranRetryAt = performance.now() + 60000; return; }
  const order = ranShuffle(RAN_SLOTS);
  const tryOpen = i => {
    if (RAN !== me) return;
    if (i >= order.length) { RAN = null; ranRetryAt = performance.now() + 30000; return; }   // 席がいっぱい
    const peer = new Peer(RAN_PREFIX + order[i]); me.peer = peer; me.slot = order[i];
    peer.on('open', () => { if (RAN === me) me.open = true; else peer.destroy(); });
    peer.on('error', err => {
      if (RAN !== me || me.peer !== peer) return;
      if (err.type === 'unavailable-id') { peer.destroy(); tryOpen(i + 1); return; }
      if (err.type === 'peer-unavailable') return;
      peer.destroy(); RAN = null; ranRetryAt = performance.now() + 20000;   // サーバーにつながらない：少し待って取り直す
    });
    peer.on('disconnected', () => { if (RAN === me && !me.pend) { peer.destroy(); RAN = null; ranRetryAt = performance.now() + 5000; } });
    peer.on('connection', conn => ranIncoming(me, conn));
  };
  tryOpen(0);
}
function ranIncoming(me, conn){
  const no = () => { conn.on('open', () => { try { conn.send({ t: 'busy' }); } catch(e) {} setTimeout(() => conn.close(), 300); }); };
  if (RAN !== me || me.pend || !ranReady()) return no();
  me.pend = conn;
  const drop = () => { if (me.pend === conn) { me.pend = null; try { conn.close(); } catch(e) {} } };
  const tm = setTimeout(drop, 6000);   // 6秒たっても挨拶がなければあきらめる
  conn.on('close', () => { clearTimeout(tm); if (me.pend === conn) me.pend = null; });
  conn.on('data', m => {
    if (me.pend !== conn || !m || m.t !== 'hello') return;
    clearTimeout(tm);
    if (!ranReady()) { try { conn.send({ t: 'busy' }); } catch(e) {} return setTimeout(drop, 300); }
    // 受ける：待ち席の peer をそのまま通信対戦に使う（席は一度返し、終わったら取り直す）
    RAN = null; ranTagSync();
    NET = { role: 'host', peer: me.peer, conn, code: '', ran: true };
    conn.removeAllListeners('data'); conn.removeAllListeners('close');
    conn.on('data', netRecv);
    conn.on('close', () => { if (NET && NET.conn === conn) netFail('乱入者との接続が切れました'); });
    conn.on('error', () => { if (NET && NET.conn === conn) netFail('通信でエラーが起きました'); });
    netHello(conn); netRecv(m);   // 相手の装備を受け取り → ranBegin
  });
}
// 「乱入者あらわる！」：CPU 戦を止めて取っておき、少し見せてから始める
function ranBegin(){
  RAN_HOLD = G; G = null; quitBtn.hidden = true; P.attack = P.dash = P.throw = P.ougi = false;
  BGM.play('loadout'); SFX.ko();
  ranAlert('乱入者あらわる！', `${WEAPONS[NET.opp.w].name}を持った乱入者が勝負を挑んできた`);
  setTimeout(() => { if (NET && NET.ran && !G) netStart(); }, 2200);
}
function ranAlert(head, sub){
  ov.innerHTML = `<div class="ranAl"><div class="ranH">${head}</div><div class="ranS">${sub}</div></div>`; ov.hidden = false;
}
// CPU 戦に戻る（止めたところから。仕切り直しの「始め！」を挟む）
function ranResume(msg){
  const n = NET; setTimeout(() => { if (NET === n) netClose(); }, 200);
  const g = RAN_HOLD; RAN_HOLD = null; ranRetryAt = performance.now() + 3000;   // 戻ってすぐ次の乱入が来ないよう、ほんの少し空ける（v0.35.1：15秒は長すぎて2回目が入れなかった）
  if (!g) { G = null; return title(); }
  G = g; G.phase = 'intro'; G.phaseT = 0; G.startSnd = 0; G.hitstop = 0; G.slowT = 0;
  P.attack = P.dash = P.throw = P.ougi = false;
  ov.hidden = true; quitBtn.hidden = false; quitBtn.textContent = 'やめる'; BGM.play('duel');
}

// ---------- 乱入する側 ----------
function ranScreen(msg){

  const wBtns = WKEYS.map(k => `<button class="nW${k === myW ? ' on' : ''}" data-w="${k}">${WEAPONS[k].name}</button>`).join('');
  screen('乱入', `<div class="nBox">
    <p class="nNote">いま CPU 戦をしている誰かの試合に割り込んで1対1（2本先取）。勝てば小判 ${RAN_PAY}。装備は今のまま使えます。</p>
    <div class="nLbl">使う武器</div><div class="nWs">${wBtns}</div>
    <button id="nRan" class="nBig ranBig">乱入する<small>受付中の人を探す</small></button>

    ov.querySelectorAll('.nW').forEach(x => x.classList.toggle('on', x === b)); SFX.coin(); });
  document.getElementById('nRan').onclick = ranJoin;

async function ranJoin(){
  netClose(); ranCloseLobby(); netStatus('受付中の人を探しています…');
  const btn = document.getElementById('nRan'); if (btn) btn.disabled = true;
  const done = text => { if (btn) btn.disabled = false; netStatus(`<span class="ng">${text}</span>`); };
  try { await netLoadLib(); } catch(e) { return done(e.message); }
  // v0.35.1：見つからなければ探し直す（60秒まで）。相手が結果の画面や装備選びの間でも、戻ってきたら入れる
  // v0.35.2：速く探しすぎると PeerJS のサーバーに切られる（約20秒・70回で network）→ 席へは0.12秒ずつずらして声をかけ、6秒ごとに。
  //   それでも切られたら、つなぎ直して続ける
  const me = { peer: null, chosen: null, miss: 0, conns: [], gen: 0 }, t0 = performance.now(), LIMIT = 60000;
  NET = { role: 'guest', peer: null, code: '', ran: true, search: me };
  const alive = () => NET && NET.search === me && !me.chosen;
  const give = text => { if (alive()) { netClose(); done(text); } };
  const leftSec = () => Math.ceil((LIMIT - (performance.now() - t0))/1000);
  const again = (wait = 6000) => {
    if (!alive()) return;
    const left = leftSec();
    if (left*1000 <= wait) return give('今は乱入を受け付けている人がいません。しばらくしてからもう一度');
    netStatus(`受付中の人を探しています…（あと${left}秒）<br><small>相手が CPU 戦を始めたら入れます</small>`);
    const g = ++me.gen; setTimeout(() => { if (me.gen === g) scan(); }, wait);
  };
  const miss = () => { if (++me.miss === RAN_SLOTS) again(); };
  function newPeer(){
    if (!alive()) return;
    try { me.peer && me.peer.destroy(); } catch(e) {}
    const peer = new Peer(); me.peer = peer; NET.peer = peer;
    peer.on('open', () => { if (me.peer === peer) scan(); });
    peer.on('error', err => {
      if (me.chosen || me.peer !== peer) return;
      if (err.type === 'peer-unavailable') return miss();   // その席は空いている
      if (['network', 'server-error', 'socket-error', 'socket-closed', 'disconnected'].includes(err.type)) return relink();
      give('つながりませんでした（' + (err.type || err) + '）');
    });
    peer.on('disconnected', () => { if (!me.chosen && me.peer === peer) relink(); });
  }
  function relink(){   // サーバーに切られた：少し待ってつなぎ直す
    if (!alive()) return; me.gen++;
    for (const c of me.conns) { try { c.close(); } catch(e) {} } me.conns = [];
    try { me.peer && me.peer.destroy(); } catch(e) {} me.peer = null;
    if (leftSec() <= 5) return give('今は乱入を受け付けている人がいません。しばらくしてからもう一度');
    netStatus(`受付中の人を探しています…（あと${leftSec()}秒）<br><small>つなぎ直しています</small>`);
    setTimeout(newPeer, 4000);
  }
  function scan(){
    if (!alive() || !me.peer || me.peer.disconnected) return;
    for (const c of me.conns) { try { c.close(); } catch(e) {} }
    me.conns = []; me.miss = 0;
    const conns = me.conns, seen = new Set(), peer = me.peer, g = ++me.gen;
    const missOnce = conn => { if (seen.has(conn)) return; seen.add(conn); miss(); };
    ranShuffle(RAN_SLOTS).forEach((i, k) => setTimeout(() => {
      if (!alive() || me.peer !== peer || me.conns !== conns) return;
      const conn = peer.connect(RAN_PREFIX + i, { reliable: true, serialization: 'json' }); conns.push(conn);
      conn.on('data', m => {   // 選ぶ前に「受け付けていない」が返った席は、いない扱い
        if (me.chosen === conn || !m || m.t !== 'busy') return; try { conn.close(); } catch(e) {} missOnce(conn); });
      conn.on('open', () => {
        if (!alive() || me.conns !== conns) return setTimeout(() => { try { conn.close(); } catch(e) {} }, 0);
        me.chosen = conn; NET.conn = conn;
        for (const c of conns) if (c !== conn) { try { c.close(); } catch(e) {} }
        conn.removeAllListeners('data');
        conn.on('data', netRecv);
        conn.on('close', () => { if (NET && NET.conn === conn) netFail('相手との接続が切れました'); });
        conn.on('error', () => { if (NET && NET.conn === conn) netFail('通信でエラーが起きました'); });
        netStatus('見つけました！'); netHello(conn);
        ranAlert('乱入！', '相手の試合に割り込みます…');
      });
    }, k*120));
    setTimeout(() => { if (alive() && me.gen === g && me.miss < RAN_SLOTS) { me.miss = RAN_SLOTS; again(); } }, 10000);   // 返事が来ない席があっても10秒で次へ
  }
  newPeer();
  setTimeout(() => give('今は乱入を受け付けている人がいません。しばらくしてからもう一度'), LIMIT + 10000);
}

// ---------- 勝負がついた・切れた ----------

  // v0.36：再戦。ふたりとも「再戦する」を押したら、同じ相手ともう一度（中身は通信対戦の「もう一度」と同じ NET.again）

  if (host) {
    card(`<h2>${head}</h2><p>${G.e.name} に ${G.pw}-${G.ew}</p>${pay}${re}<button id="b1" class="sub">CPU戦に戻る</button>${ag}`, () => { netBye(); G = null; ranResume(); });
  } else {
    card(`<h2>${head}</h2><p>${G.e.name} に ${G.pw}-${G.ew}</p>${pay}${re}<button id="b1" class="sub">別の相手に乱入する</button><br><button id="bT" class="sub">タイトルへ</button>${ag}`,
      () => { netBye(); G = null; ranScreen(); });

  }

function ranFail(text){
  const host = NET.role === 'host', searching = NET.search && !NET.search.chosen;
  netClose(); quitBtn.hidden = true;
  if (searching) return netStatus(`<span class="ng">${text}</span>`);
  G = null;
  if (host) card(`<h2>乱入戦が終わりました</h2><p>${text}</p><button id="b1">CPU戦に戻る</button>`, () => ranResume());
  else { card(`<h2>通信が切れました</h2><p>${text}</p><button id="b1">もう一度乱入する</button><br><button id="bT" class="sub">タイトルへ</button>`, () => ranScreen());
    document.getElementById('bT').onclick = title; }
}

// ================= ガチャの演出（v0.38） =================
// 等級ごとに豪華さを変える：並＝しょぼい（ぽすっ）、上＝青い光、極＝金の光と「極」、伝＝雷・虹・花びら・「伝説」
// 昇格：箱が下の等級の色で光り始め、震えて「昇格！」で色が変わる（結果は先に決まっているので、出る確率は変わらない）
// 画面をタップすると飛ばせる。gachaShow(best, floor, done)：best＝出た等級、floor＝そのガチャのいちばん下の等級
const GX_COL = ['#9AA3AE', '#4C9BEA', '#FFD84A', '#FF4A3A'];
const GX_TXT = ['並', '上', '極', '伝説'];
// どの等級の色から始めるか：半分ほどは昇格あり。1段下からが多く、たまに2段以上下から
function gxStart(best, floor){
  if (best <= floor || Math.random() < .45) return best;
  let s = best - 1; while (s > floor && Math.random() < .35) s--;
  return s;
}
function gachaShow(best, floor, done){
  const app = document.getElementById('app'), start = gxStart(best, floor);
  const el = document.createElement('div'); el.className = 'gx';
  el.innerHTML = '<div class="gxDim"></div><div class="gxRays"></div><canvas class="gxCv"></canvas>'
    + '<div class="gxBox mk"><canvas class="gxPod" width="72" height="80"></canvas></div><div class="gxTxt"></div><div class="gxSkip">タップで飛ばす</div>';
  app.appendChild(el);
  const cv = el.querySelector('.gxCv'), cx = cv.getContext('2d'), box = el.querySelector('.gxBox'), rays = el.querySelector('.gxRays'), txt = el.querySelector('.gxTxt');
  const dpr = devicePixelRatio || 1, Wd = el.clientWidth, Hd = el.clientHeight;
  cv.width = Wd*dpr; cv.height = Hd*dpr; cx.scale(dpr, dpr);
  const CXp = Wd/2, CYp = Hd*.44;

function drawParryCue(me, att){
  if (att.state !== 'windup' || G.phase !== 'fight') return;
  const A = att.w.atk[att.atk], left = A.wind - att.t;
  const d = Math.hypot(me.x - att.x, me.y - att.y);
  if (d > A.reach + A.lunge*.5 + me.r + 30) return;
  const inArc = Math.abs(angDiff(Math.atan2(me.y - att.y, me.x - att.x), att.face)) < A.arc/2 + .5;
  if (!inArc) return;
  // 押し直しが早すぎて今押してもはじけないときは、金色にしない
  const ready = parryOpen(me) || G.now - me.guardStart > parryRearm(me);
  const now = left <= parryWin(me) && ready, R = me.r + 5 + 42*Math.min(1, left/Math.max(A.wind, .3));
  ctx.save();
  if (now) {
    ctx.strokeStyle = '#FFD84A'; ctx.lineWidth = 5; ctx.shadowColor = '#FFE88A'; ctx.shadowBlur = 12;
  } else { ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2.5; }
  ctx.beginPath(); ctx.arc(me.x, me.y, R, 0, Math.PI*2); ctx.stroke();
  ctx.shadowBlur = 0; ctx.strokeStyle = 'rgba(255,216,74,.35)'; ctx.lineWidth = 1.5;   // ゴール（体のすぐ外）
  ctx.beginPath(); ctx.arc(me.x, me.y, me.r + 5, 0, Math.PI*2); ctx.stroke();
  if (now) { ctx.font = '15px "Dela Gothic One", sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#FFD84A';
    ctx.lineWidth = 4; ctx.strokeStyle = '#15181D'; ctx.strokeText('今', me.x - me.r - 18, me.y - me.r - 4); ctx.fillText('今', me.x - me.r - 18, me.y - me.r - 4); }
  ctx.restore();
}
function drawTele(f){
  if (f.state === 'throw' && !f.thr) {   // 投げの予兆：すぐ前に緑の「掴み」の弧
    const k = f.t/THROW.wind, R = (f.thrReach ?? THROW.reach) + f.r + 6 + (f.thrLunge ?? THROW.lunge)*(1 - Math.min(1, k));
    ctx.save(); if (G.melee && f !== G.p && f.tgt !== G.p) ctx.globalAlpha = .35;
    ctx.fillStyle = `rgba(127,224,192,${.18 + .3*k})`; ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.arc(f.x, f.y, R, f.face - THROW.arc/2, f.face + THROW.arc/2); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#7FE0C0'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(f.x, f.y, R, f.face - THROW.arc/2, f.face + THROW.arc/2); ctx.stroke(); ctx.restore();
    return;
  }
  // 攻撃の予兆：ため中は攻撃範囲が赤く満ちていく。3段目は橙で脈打つ
  if (f.state !== 'windup') return;
  const A = f.w.atk[f.atk], k = f.t / A.wind, R = A.reach + A.lunge*.5 + 8;
  const faint = G.melee && f !== G.p && f.tgt !== G.p;   // 乱戦：自分を狙っていない攻撃の予兆は薄く
  ctx.save(); if (faint) ctx.globalAlpha = .3; ctx.translate(f.x, f.y);
  ctx.fillStyle = A.heavy ? `rgba(255,140,40,${.15 + .35*k + .1*Math.sin(G.now*40)})` : `rgba(230,60,50,${.12 + .3*k})`;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0, 0, R, f.face - A.arc/2, f.face + A.arc/2); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = A.heavy ? '#FFB347' : 'rgba(255,120,110,.8)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, R*k, f.face - A.arc/2, f.face + A.arc/2); ctx.stroke();
  ctx.restore();
  if (A.heavy) { ctx.save(); if (faint) ctx.globalAlpha = .45; ctx.font = '22px "Dela Gothic One", sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#FFB347';
    ctx.lineWidth = 4; ctx.strokeStyle = '#15181D'; ctx.strokeText('!', f.x, f.y - 50); ctx.fillText('!', f.x, f.y - 50); ctx.restore(); }
}

function horoView(w, cx, mon){
  const W = 24, H = 20, rows = [];

      r += (Math.abs(dx*4 - sx) < .18 && sx !== 0 && Math.abs(sx) < 4) ? 'u' : 'U';
    }

// ドットの線（刀）：px ドットの大きさで1マスずつ打つ
function pixLine(c, x0, y0, x1, y1, px, col){
  x0 = Math.round(x0/px); y0 = Math.round(y0/px); x1 = Math.round(x1/px); y1 = Math.round(y1/px);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let e = dx + dy;
  c.fillStyle = col;
  for (let n = 0; n < 200; n++) { c.fillRect(x0*px, y0*px, px, px); if (x0 === x1 && y0 === y1) break; const e2 = 2*e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } }
}

// 刃の軸に沿って u（前へ）、横へ v のドットで線を引く。先に全部を半ドット下へずらして濃い色で描き、縁取りにする

// 武器の絵：組（種類・刃・白・大きさ・長さ）ごとに、角度 1/128 周ずつの絵を作って覚える
// v0.33.1：試合中にその場で作ると iPhone でカクつくので、
//   ① 試合の大きさ（MECH_PX）の組を初めて見たら、全部の角度を「粗い角度から順に」作る予約をし、毎フレーム少しずつ作る（warmStep）
//   ② まだない角度は、近い角度（±3＝約8度まで。同じ組になければ長さ±1〜3の組、被弾の白なら普通の絵）で代わりに描き、ちょうどの絵は予約。どれもなければその場で作る
//   ③ 絵は 1024 四方の画像（ページ）に棚のように詰める（大きな1枚だと、書き足すたびの送り直しが重い）
const AQ = 128, WCombos = new Map(), WFam = new Set(), WPages = [];
const AQ_ORDER = Array.from({ length: AQ }, (_, i) => { let r = 0; for (let b = 0; b < 7; b++) if (i & (1 << b)) r |= 1 << (6 - b); return r; });   // ビット反転：0, 64, 32, 96, 16, …
function wPage(w, h){
  let p = WPages[WPages.length - 1];
  if (p && p.x + w > p.S) { p.x = 0; p.y += p.rowH + 1; p.rowH = 0; }
  if (!p || p.y + h > p.S) {
    if (WPages.length >= 10) { WPages.length = 0; WCombos.clear(); WFam.clear(); }   // 多すぎたら全部やり直し（めったにない）
    const cv = document.createElement('canvas'); cv.width = cv.height = 1024; p = { cv, c: cv.getContext('2d'), x: 0, y: 0, rowH: 0, S: 1024 }; WPages.push(p);
  }
  const at = { pg: p, sx: p.x, sy: p.y }; p.x += w + 1; p.rowH = Math.max(p.rowH, h); return at;
}

  const key = wKey(wk, bladeKey, white, px, n, kq); let cb = WCombos.get(key);

// テスト用（v0.49）：アドレスの最後に ?kaihou=1 をつけて開くと、全部の面をクリア済み（★1）にする。取った星は残す。開いたらアドレスから消す
try { if (/[?&]kaihou=1/.test(location.search)) { STAGE_LIST.forEach(s => { const o = stProg[s.id] || []; stProg[s.id] = [true, !!o[1], !!o[2]]; }); stSave();
  history.replaceState(null, '', location.pathname); setTimeout(() => alertCard('全章を開放しました（テスト用）'), 300); } } catch(e) {}
function alertCard(t){ const d = document.createElement('div'); d.textContent = t;
  d.style.cssText = 'position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:99999;background:#FFC93A;color:#2A1A00;font-weight:900;padding:12px 18px;border:3px solid #000;border-radius:14px;box-shadow:0 4px 0 #000;font-size:15px;';
  document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
const stCleared = id => !!(stProg[id] && stProg[id][0]);
const stStars = id => (stProg[id] || []).filter(Boolean).length;
const stOpen = st => st.ch === 0 && st.i === 0 || (() => { const p = STAGE_LIST[STAGE_LIST.indexOf(st) - 1]; return p && stCleared(p.id); })();
const stNext = () => STAGE_LIST.find(s => !stCleared(s.id)) || STAGE_LIST[STAGE_LIST.length - 1];   // 次に挑む面（全部クリアなら最後の面）
const stBoss = st => st.boss ? BOSSES.find(b => b.set === st.boss) : null;
const stWk = st => st.boss ? stBoss(st).wk : st.wk;
const stCount = k => (G && G.count[k]) || 0;
const stGoalOk = g => g.max ? stCount(g.k) <= g.n : stCount(g.k) >= g.n;
// 試合の上の帯に出す文：面とお題の進み具合

// 装備画面の下：面の名前とお題
const stHead = def => CUR_STAGE ? `<span class="stTag">${CUR_STAGE.id}</span>${def}` : def;
const stGoalLine = () => CUR_STAGE ? `<small class="stGoal">★お題：${CUR_STAGE.goal.t}</small>` : '';
// 面に挑む（装備画面へ）。again：負けた相手（防具）をそのまま
function stGo(st, again){ CUR_STAGE = st; loadout(st.lv, stWk(st), again || null); }

// ---- 面の選択画面 ----
function stageScreen(sel){

      <button class="stArr" id="stNextCh" ${chOpen(sel.ch + 1) ? '' : 'disabled'} aria-label="次の章">${CHAPTERS[sel.ch + 1] && !chOpen(sel.ch + 1) ? '🔒' : '›'}</button></div>
    <div class="stMap ch${sel.ch}">${list.map(node).join('')}<svg class="stPath" viewBox="0 0 100 100" preserveAspectRatio="none"><polyline points="${[18, 50, 82, 62, 30, 50].map((x, k) => `${x},${92 - k*16.8}`).join(' ')}"/></svg></div>
    <div class="stInfo${B ? ' boss' : ''}">

// ---- 勝負がついたとき（endRound から） ----

  const now = [win, win && stGoalOk(g), win && G.p.hp >= G.p.maxHp/2], old = stProg[st.id] || [false, false, false];
  const newStar = now.map((v, j) => v && !old[j]);
  stProg[st.id] = old.map((v, j) => !!(v || now[j])); stSave();
  if (win && st.lv + 1 > bestLv) { bestLv = st.lv + 1; try { localStorage.setItem('maai_best', bestLv); } catch(e) {} }
  // 小判：1本ごとに5、勝てば 30＋Lv×5、初めてのクリア 60＋Lv×20、新しい星1つに 20、はじき1回に1（10まで）
  const ns = newStar.filter(Boolean).length;
  const pay = [['1本×' + G.pw, G.pw*5], ['勝利', win ? 30 + st.lv*5 : 0], ['初クリア', first ? 60 + st.lv*20 : 0], ['新しい★×' + ns, ns*20], ['はじき×' + Math.min(10, G.count.parry), Math.min(10, G.count.parry)]].filter(x => x[1] > 0);
  const total = pay.reduce((a, x) => a + x[1], 0);
  if (win) bag.cleared = Math.max(bag.cleared, st.lv);
  bag.koban += total; saveBag(); if (win) SFX.win(); else SFX.lose();
  // 仕掛け：勝てば1つ（強敵ならその銘の極以上）、負けても1本取っていれば3割で1つ
  const drops = win ? [G.boss ? bossDrop(G.boss) : makeGear(dropGrade(st.lv/2))] : G.pw && Math.random() < .3 ? [makeGear(dropGrade(0))] : [];
  // 章の最後の強敵を初めて倒したら、心臓か鍔玉を必ず1つ（どちらも全部持っていれば小判）
  let hd = null, od = null;

    if (first && !hd && !od) { const uh = HEART_KEYS.filter(k => bag.hearts[k] == null), uo = ORB_KEYS.filter(k => bag.orbs[k] == null);
      if (uh.length) { hd = pickOne(uh); bag.hearts[hd] = 0; } else if (uo.length) { od = pickOne(uo); bag.orbs[od] = 0; } saveBag(); } }
  const got = dropHtml(grantGear(drops), win && G.boss) + (hd ? `<div class="dropT">からくり心臓「${HEARTS[hd].n}」を手に入れた！</div>` : '') + (od ? `<div class="dropT">${ORBS[od].i} ${ORBS[od].n}を手に入れた！</div>` : '');
  const earn = `<p class="earn">小判 <b>+${total}</b><small>${pay.map(x => `${x[0]} ${x[1]}`).join('　')}</small>持っている小判：${bag.koban}</p>`;
  const lbl = [`勝つ`, g.s, '体力を半分以上残して勝つ'];
  const stars = `<div class="stRes">${now.map((v, j) => `<div class="${v ? 'on' : ''}${newStar[j] ? ' new' : ''}" style="animation-delay:${.15 + j*.25}s"><i>★</i><span>${lbl[j]}${newStar[j] ? '<em>NEW</em>' : ''}</span></div>`).join('')}</div>`;
  const nx = STAGE_LIST[STAGE_LIST.indexOf(st) + 1], chEnd = win && !nx;
  const name = G.boss ? `強敵 ${G.boss.n}` : G.e.name;
  card(win ? `<h2>${st.id} クリア！</h2><p>${name} を ${G.pw}-${G.ew} で倒しました。${first && nx ? `<br><b class="stUnlock">${nx.ch !== st.ch ? `${CHAPTERS[nx.ch].n}「${CHAPTERS[nx.ch].place.replace(/^.*「|」$/g, '')}」が開きました` : `${nx.id} が開きました`}</b>` : ''}${chEnd && first ? `<br><b class="stUnlock">すべての章をクリア！ おみごと</b>` : ''}</p>${stars}${earn}${got}
       ${nx ? `<button id="b1">次の面へ（${nx.id}）</button>` : `<button id="b1">面の選択へ</button>`}<button id="stRe" class="sub">もう一度</button>`
     : `<h2>敗北</h2><p>${name} に ${G.pw}-${G.ew} で負けました。<br>装備を見直して、もう一度挑めます。</p><p class="stHint">ヒント：${st.tip}</p>${earn}${got}<button id="b1">もう一度挑む</button>`,
    () => win ? (nx ? stGo(nx) : stageScreen()) : stGo(st, G.eGear));
  paintThumbs();
  quitBtn.hidden = true;
  const c = ov.querySelector('.card');
  if (win) { const eG = G.eGear; document.getElementById('stRe').onclick = () => stGo(st, eG); }
  if (!win || nx) { c.insertAdjacentHTML('beforeend', '<br><button id="stSel" class="sub">面の選択へ</button>'); document.getElementById('stSel').onclick = () => stageScreen(st); }
}

// ---- 闘技場のギミック（v0.45）：第2章＝ベルトコンベア ----
// 台の左右に縦のベルト2本（左は下へ・右は上へ流れる）。乗っている者は流される（宙に浮いている・つかまれている間はなし）
// 流れは9秒ごとに逆になり、変わる1.2秒前に矢印が赤く点滅する。強敵の面は速い。update の stepF の前に呼ぶ（闘技場の外に出ないのは stepF が直す）
const BELTS = [[-60, 1], [60, -1]], BELT_HW = 18, BELT_PER = 9, BELT_WARN = 1.2;
function stGimmick(dt){
  const gm = CHAPTERS[G.stage.ch].gim;
  if (gm === 'fire') return stFire(dt);
  if (gm === 'steam') return stSteam(dt);
  if (gm === 'edge') return stEdge(dt);
  if (gm !== 'belt') return;
  const B = G.belt || (G.belt = { dir: 1, t: 0, off: 0 });
  B.t += dt; if (B.t >= BELT_PER) { B.t -= BELT_PER; B.dir *= -1; say('流れが逆に！', AR.x, AR.y - 30, '#FFC93A', 18, 1); SFX.dash(AR.x); }
  const v = (G.stage.boss ? 66 : 50)*B.dir; B.off += v*dt;
  for (const f of [G.p, G.e]) { if (!f || f.z || f.state === 'held' || f.dead) continue;
    for (const [bx, sg] of BELTS) if (Math.abs(f.x - (AR.x + bx)) < BELT_HW) f.y += v*sg*dt; }
}
// 工房の台の上にベルトを描く（drawKoboArena の中、台の円で切り抜いた中から呼ぶ）
function drawBelts(cx, cy, r){
  const B = (G && G.belt) || { dir: 1, t: 0, off: 0 }, warn = B.t > BELT_PER - BELT_WARN && Math.floor(B.t*8) % 2 === 0;
  for (const [bx, sg] of BELTS) { const x0 = cx + bx - BELT_HW, w = BELT_HW*2, d = B.dir*sg;
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(x0 - 3, cy - r, w + 6, r*2);
    ctx.fillStyle = '#231C16'; ctx.fillRect(x0, cy - r, w, r*2);
    ctx.fillStyle = '#B8862E'; ctx.fillRect(x0 - 2, cy - r, 2, r*2); ctx.fillRect(x0 + w, cy - r, 2, r*2);   // 真鍮の枠
    ctx.fillStyle = '#F0D088'; ctx.fillRect(x0 - 1, cy - r, 1, r*2);
    const off = ((B.off*sg) % 12 + 12) % 12;
    ctx.fillStyle = '#3A3028'; for (let y = cy - r - 12 + off; y < cy + r; y += 12) ctx.fillRect(x0 + 1, Math.round(y), w - 2, 3);   // 桟
    ctx.strokeStyle = warn ? '#FF6A3A' : 'rgba(255,200,110,.55)'; ctx.lineWidth = 3; ctx.lineCap = 'round';   // 流れの向きの矢印
    const aoff = ((B.off*sg) % 36 + 36) % 36;
    for (let y = cy - r - 36 + aoff; y < cy + r + 36; y += 36) { ctx.beginPath(); ctx.moveTo(x0 + 8, y - 5*d); ctx.lineTo(x0 + w/2, y + 5*d); ctx.lineTo(x0 + w - 8, y - 5*d); ctx.stroke(); }
    ctx.lineCap = 'butt'; }
}

// ---- 第3章：火を噴く床（v0.46） ----
// 台の鉄板（arena_ro.js の firePlates）から数枚を選び、予告（赤く点滅）1.5秒 → 火 2秒 → 冷める 1秒。少しずつずらして次々に選ぶ
// 火の上（宙に浮いていない）にいると毎秒12減る。相手が火に入るたびにお題の「焼く」を数える
// AIは立っているとき（idle）だけ、予告・火の板から外へ逃げる（よろめき・投げられた後は逃げられない＝押し込むと焼ける）
const FIRE_WARN = 1.5, FIRE_ON = 2, FIRE_COOL = 1, FIRE_DPS = 12;
function stFire(dt){
  const P = firePlates(), F = G.fire || (G.fire = { st: [], next: 1.5 }), boss = !!G.stage.boss;
  F.next -= dt;
  if (F.next <= 0) { F.next = boss ? 2.4 : 3; const free = P.map((_, i) => i).filter(i => !F.st[i]);
    for (let k = 0; k < (boss ? 4 : 3) && free.length; k++) { const i = free.splice(Math.floor(Math.random()*free.length), 1)[0]; F.st[i] = { k: 'warn', t: 0 }; } }
  F.st.forEach((s, i) => { if (!s) return; s.t += dt;
    if (s.k === 'warn' && s.t >= FIRE_WARN) { s.k = 'fire'; s.t = 0; }
    else if (s.k === 'fire' && s.t >= FIRE_ON) { s.k = 'cool'; s.t = 0; }
    else if (s.k === 'cool' && s.t >= FIRE_COOL) F.st[i] = null; });
  const on = f => P.findIndex(p => Math.abs(f.x - (AR.x + p.x)) < FIRE_S/2 && Math.abs(f.y - (AR.y + p.y)) < FIRE_S/2);
  for (const f of [G.p, G.e]) { if (!f || f.dead) continue;
    const i = on(f), s = i >= 0 ? F.st[i] : null, hot = s && s.k === 'fire' && !f.z;
    if (hot) { if (!f.inFire) { f.inFire = true; say('熱っ！', f.x, f.y - 42, '#FF8A3A', 16, .7); if (f === G.e) G.count.burn = (G.count.burn || 0) + 1; }
      f.hp -= FIRE_DPS*dt; f.fireFx = (f.fireFx || 0) + dt; if (f.fireFx > .12) { f.fireFx = 0; spark(f.x, f.y, '#FF8A3A', 3, 90); }
      if (f.hp <= 0 && G.phase === 'fight') { f.hp = 0; ko(f); } }
    else f.inFire = false;
    if (f.isAI && f.state === 'idle' && s && s.k !== 'cool') {   // AI：熱い板から外へ逃げる
      const p = P[i], dx = f.x - (AR.x + p.x), dy = f.y - (AR.y + p.y), l = Math.hypot(dx, dy) || 1;
      const ux = l > 1 ? dx/l : Math.cos(f.face + Math.PI), uy = l > 1 ? dy/l : Math.sin(f.face + Math.PI);
      f.x += ux*130*dt; f.y += uy*130*dt; } }
}

// ---- 1本ごとの準備（newRound から）：第4章の地形、第5章の床、将軍の持ちかえ ----
function stRoundInit(){
  const gm = CHAPTERS[G.stage.ch].gim;
  if (gm === 'steam') {   // 鉄柱3本（真ん中と、180度回して同じ形）。v0.48 雲はやめて、蒸気の噴き出し（G.jets）
    G.terrain = { pits: [], pillars: [{ x: AR.x, y: AR.y, r: 16 }, { x: AR.x - 92, y: AR.y - 48, r: 13 }, { x: AR.x + 92, y: AR.y + 48, r: 13 }], bushes: [], steam: 1 };
    if (!G.jets) G.jets = { st: [], next: 2 };
  }
  if (gm === 'edge') { AR.r = DUEL_R; G.edge = { t: 0, i: 0, warn: false, wt: 0, fallT: 0 }; }
}
// ---- 第4章：蒸気の噴き出し（v0.48） ----
// 台を横切る4本の線（横2本・縦2本）。端の噴き出し口が光って線が点滅（予告 JET_WARN 秒）→ 蒸気が JET_ON 秒噴く
// 噴いている間に線の上にいる者（宙・回避の無敵中は除く）は、流れの向きへ吹き飛ばされて少しよろめく（1回の噴き出しで1度だけ）
// AIは立っているとき、予告・噴いている線から横へ逃げる。相手が当たるとお題の steamed を数える
const JETS = [{ ax: 'h', o: -70, d: 1 }, { ax: 'h', o: 70, d: -1 }, { ax: 'v', o: -50, d: 1 }, { ax: 'v', o: 50, d: -1 }], JET_HW = 17, JET_WARN = 1.2, JET_ON = .6;
const jetIn = (j, f) => j.ax === 'h' ? Math.abs(f.y - (AR.y + j.o)) < JET_HW : Math.abs(f.x - (AR.x + j.o)) < JET_HW;
function stSteam(dt){
  if (G.terrain && G.terrain.steam) for (const f of [G.p, G.e]) if (f) terrainStep(f);
  const J = G.jets; if (!J) return; const boss = !!G.stage.boss;
  J.next -= dt;
  if (J.next <= 0) { J.next = boss ? 2.2 : 2.8; const free = JETS.map((_, i) => i).filter(i => !J.st[i]);
    for (let k = 0; k < (boss && Math.random() < .5 ? 2 : 1) && free.length; k++) { const i = free.splice(Math.floor(Math.random()*free.length), 1)[0]; J.st[i] = { k: 'warn', t: 0, hit: [] }; } }
  J.st.forEach((s, i) => { if (!s) return; s.t += dt; const j = JETS[i];
    if (s.k === 'warn' && s.t >= JET_WARN) { s.k = 'on'; s.t = 0; SFX.dash(AR.x); }
    else if (s.k === 'on' && s.t >= JET_ON) { J.st[i] = null; return; }
    for (const f of [G.p, G.e]) { if (!f || f.dead) continue;
      if (s.k === 'on' && jetIn(j, f) && !f.z && !(f.iframe > 0) && f.state !== 'held' && !s.hit.includes(f)) { s.hit.push(f);
        const vx = j.ax === 'h' ? j.d : 0, vy = j.ax === 'v' ? j.d : 0; f.kx += vx*380; f.ky += vy*380;
        if (f.state !== 'stun') { f.state = 'stun'; f.stunKind = 'hit'; f.stunT = .4; f.t = 0; f.guard = false; f.queued = false; }
        say('蒸気！', f.x, f.y - 40, '#DCEBE6', 17, .8); spark(f.x, f.y, '#E8F4F0', 12, 220);
        if (f === G.e) G.count.steamed = (G.count.steamed || 0) + 1; }
      if (f.isAI && f.state === 'idle' && jetIn(j, f)) {   // AI：線から横へ逃げる。相手のいる側へ（歩きたい向きと逆らわないように）
        const o = f === G.p ? G.e : G.p, ln = j.ax === 'h' ? AR.y + j.o : AR.x + j.o, me = j.ax === 'h' ? f.y : f.x, ot = j.ax === 'h' ? o.y : o.x;
        const sg = Math.sign(Math.abs(ot - ln) > JET_HW ? ot - ln : me - ln) || 1;
        if (j.ax === 'h') f.y += sg*170*dt; else f.x += sg*170*dt; } } });
}
// 噴き出し口と蒸気の絵（drawJokiArena の中、台の円で切り抜いた中から呼ぶ）
function drawJets(cx, cy, r){

function yokoCam(){
  const a = G.p, b = G.e, now = performance.now()/1000, k = G.yk ? Math.min(1, (now - G.yk.t)*6) : 1;
  const tx = (a.x + b.x)/2, ty = (a.y + b.y)/2 - 14, dx = Math.abs(a.x - b.x) + 70, dy = Math.abs(a.y - b.y) + 90;
